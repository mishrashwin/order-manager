# ============================================
# Docker Compose - LOCAL DEVELOPMENT ONLY
# ============================================
# This file is for containerized local testing with MySQL.
#
# IMPORTANT:
# - Production uses PostgreSQL on Render (see render.yaml)
# - Flyway migrations (src/main/resources/db/migration/) are PostgreSQL-specific
# - This setup uses MySQL with Hibernate auto-schema (Flyway disabled)
# - For PostgreSQL testing, use: docker-compose -f docker-compose.postgres.yml up
#
# See DOCKER_SETUP.md for detailed documentation
# ============================================

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: order-manager-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: order_manager_db
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Migration files removed - Hibernate handles schema in dev (Flyway disabled)
      # Production uses PostgreSQL with Flyway on Render
    networks:
      - order-manager-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-manager-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:mysql://mysql:3306/order_manager_db?useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_FRONTEND_URL: http://localhost:8080
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    networks:
      - order-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  order-manager-network:
    driver: bridge

