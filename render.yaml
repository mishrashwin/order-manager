services:
  # Web Service - Spring Boot Application (FREE TIER)
  - type: web
    name: order-manager
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon # Free tier available
    plan: free # ✅ FREE TIER - No payment needed!
    branch: DockerSetup # ✅ Use DockerSetup branch for deployment
    healthCheckPath: /actuator/health
    envVars:
      # ===== Server Port =====
      - key: PORT
        value: "8080"

      # ===== Application Profile =====
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ===== Database (Render FREE PostgreSQL) =====
      # Extract individual connection parameters from database service
      - key: DB_HOST
        fromDatabase:
          name: order-manager-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: order-manager-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: order-manager-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: order-manager-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: order-manager-db
          property: password

      # ===== PostgreSQL Driver =====
      - key: DB_DRIVER
        value: org.postgresql.Driver

      # ===== Hibernate (PostgreSQL) =====
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQL10Dialect

      # ===== Email (Gmail) =====
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false # Set manually
      - key: MAIL_PASSWORD
        sync: false # Set manually
      - key: MAIL_FROM
        sync: false # Set manually

      # ===== Application URLs =====
      - key: APP_FRONTEND_URL
        value: https://order-manager.onrender.com
      - key: APP_BASE_URL
        value: https://order-manager.onrender.com

      # ===== JVM Optimization (for free tier's 0.5GB RAM) =====
      - key: JAVA_OPTS
        value: -Xmx256m -Xms128m -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0

# ===== FREE PostgreSQL Database =====
databases:
  - name: order-manager-db
    databaseName: order_manager_db
    plan: free # ✅ COMPLETELY FREE!
    region: oregon # Same region as web service



