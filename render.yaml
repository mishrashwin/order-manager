services:
  # Web Service - Spring Boot Application (FREE TIER)
  - type: web
    name: order-manager
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon # Free tier available
    plan: free # ✅ FREE TIER - No payment needed!
    healthCheckPath: /
    envVars:
      # ===== Server Port =====
      - key: PORT
        value: "8080"

      # ===== Application Profile =====
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ===== Database (Neon PostgreSQL - External Free Tier) =====
      # Using Neon.tech for persistent PostgreSQL database
      # Connection details from: https://console.neon.tech/app/projects/winter-lake-23781382
      - key: DB_HOST
        value: ep-damp-term-adjgxa80-pooler.c-2.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false # Set this manually in Render dashboard with your Neon password

      # ===== PostgreSQL Driver =====
      - key: DB_DRIVER
        value: org.postgresql.Driver

      # ===== Email (Brevo API - HTTP-based, Render free tier compatible) =====
      # Using API instead of SMTP because Render blocks SMTP ports
      - key: BREVO_API_KEY
        sync: false # Set manually in Render dashboard
      - key: MAIL_FROM
        sync: false # Set manually in Render dashboard

      # ===== Application URLs =====
      - key: APP_FRONTEND_URL
        sync: false # Set manually in Render dashboard
      - key: APP_BASE_URL
        sync: false # Set manually in Render dashboard

      # ===== Owner Console Credentials / Notifications =====
      - key: OWNER_EMAIL
        sync: false # Set manually in Render dashboard
      - key: OWNER_USERNAME
        sync: false # Set manually in Render dashboard
      - key: OWNER_PASSWORD
        sync: false # Set manually in Render dashboard

      # ===== Payment Settings =====
      - key: PAYMENT_UPI_ID
        sync: false # Set manually in Render dashboard (fallback in app properties applies if unset)

      # ===== JVM Optimization (for free tier's 0.5GB RAM) =====
      - key: JAVA_OPTS
        value: -Xmx256m -Xms128m -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0

# ===== DATABASE CONFIGURATION =====
# Using Neon.tech PostgreSQL (external provider)
# No database section needed - using external Neon database
# Neon provides persistent storage without 1-month limitation
