# ===============================
# = QA ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = DATABASE CONFIGURATION (Cloud MySQL/PostgreSQL)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# = DB MIGRATION (Enable for QA)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}

# ===============================
# = SWAGGER UI (SpringDoc) - ENABLED FOR QA
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# = LOGGING (INFO level for QA)
# ===============================
logging.level.root=INFO
logging.level.com.example.ordermanager=INFO
logging.level.org.springframework.web.servlet.resource=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# = EMAIL SETUP - GMAIL (QA)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# = APP SETTINGS (QA)
# ===============================
app.frontend.url=${APP_FRONTEND_URL:https://order-manager-qa.onrender.com}
app.base.url=${APP_BASE_URL:https://order-manager-qa.onrender.com}

# ===============================
# = SECURITY SETTINGS
# ===============================
server.error.include-message=always
server.error.include-stacktrace=never

