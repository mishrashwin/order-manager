# ===============================
# = QA ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# = DB MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}

# ===============================
# = SWAGGER UI - DISABLED FOR QA
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# = LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example.ordermanager=INFO
logging.level.org.springframework.web.servlet.resource=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# = EMAIL SETUP (Brevo API)
# ===============================
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}
brevo.request-timeout-ms=5000

# ===============================
# = APP SETTINGS (QA)
# ===============================
app.base.url=${APP_BASE_URL:https://order-manager-qa.onrender.com}

# ===============================
# = SECURITY SETTINGS
# ===============================
server.error.include-message=always
server.error.include-stacktrace=never

# ===============================
# = OWNER CONSOLE CREDENTIALS
# ===============================
app.owner.email=${OWNER_EMAIL}
app.owner.username=${OWNER_USERNAME}
app.owner.password=${OWNER_PASSWORD}

