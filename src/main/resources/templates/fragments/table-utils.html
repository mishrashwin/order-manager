<script th:fragment="tableUtils" xmlns:th="http://www.w3.org/1999/xhtml">
  // Expose function for manual initialization (e.g., after AJAX loads)
  window.initTableUtils = function(containerSelector, options) {
    const container = containerSelector ? document.querySelector(containerSelector) : document;
    const searchInputId = options?.searchInputId || 'searchInput';
    const resetBtnId = options?.resetBtnId || 'resetSortBtn';

      // 📱 Mobile Table Scroll Indicator
      container.querySelectorAll(".table-responsive").forEach(tableContainer => {
          function checkScroll() {
              const isScrolledToEnd = tableContainer.scrollLeft + tableContainer.clientWidth >= tableContainer.scrollWidth - 5;
              tableContainer.classList.toggle("scrolled-end", isScrolledToEnd);
          }

          tableContainer.addEventListener("scroll", checkScroll);
          checkScroll(); // Initial check
      });

      container.querySelectorAll("table").forEach(table => {
          const tbody = table.querySelector("tbody");
          if (!tbody) return;

          const originalRows = Array.from(tbody.querySelectorAll("tr"));
          const searchInput = container.querySelector("#" + searchInputId);
          const resetBtn = container.querySelector("#" + resetBtnId);

          // 🔍 Universal Search Filter
          function applySearchFilter() {
              if (!searchInput) return;
              const filter = searchInput.value.toLowerCase();
              tbody.querySelectorAll("tr").forEach(row => {
                  const text = row.innerText.toLowerCase();
                  row.style.display = text.includes(filter) ? "" : "none";
              });
          }

          if (searchInput) {
              searchInput.addEventListener("keyup", applySearchFilter);
          }

          // ↕ Column Sorting
          table.querySelectorAll("thead th").forEach((th, index) => {
              if (th.classList.contains("no-sort") || th.innerText.toLowerCase().includes("action")) return;

              th.addEventListener("click", () => {
                  const rows = Array.from(tbody.querySelectorAll("tr"));
                  const isAsc = !th.classList.contains("sort-asc");

                  table.querySelectorAll("th").forEach(t => t.classList.remove("sort-asc", "sort-desc"));
                  th.classList.toggle("sort-asc", isAsc);
                  th.classList.toggle("sort-desc", !isAsc);

                  const visibleRows = rows.filter(r => r.style.display !== "none");
                  visibleRows.sort((a, b) => {
                      const cellA = a.children[index];
                      const cellB = b.children[index];
                      const valA = cellA.getAttribute('data-sort-value') || cellA.innerText.trim().toLowerCase();
                      const valB = cellB.getAttribute('data-sort-value') || cellB.innerText.trim().toLowerCase();
                      
                      return isAsc
                          ? valA.localeCompare(valB, undefined, { numeric: true })
                          : valB.localeCompare(valA, undefined, { numeric: true });
                  });

                  tbody.innerHTML = "";
                  visibleRows.forEach(row => tbody.appendChild(row));
                  rows.filter(r => r.style.display === "none").forEach(row => tbody.appendChild(row));
              });
          });

          // 🔁 Reset Sorting
          if (resetBtn) {
              resetBtn.addEventListener("click", () => {
                  table.querySelectorAll("th").forEach(t => t.classList.remove("sort-asc", "sort-desc"));
                  tbody.innerHTML = "";
                  originalRows.forEach(row => tbody.appendChild(row));
                  applySearchFilter();
              });
          }
      });
  };

  // Auto-initialize on DOMContentLoaded
  document.addEventListener("DOMContentLoaded", function () {
      window.initTableUtils();
  });
</script>
