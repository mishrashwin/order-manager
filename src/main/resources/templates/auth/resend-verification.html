<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resend Verification | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .fade-out {
            transition: opacity 0.5s ease-out;
            opacity: 0;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
<div class="card shadow p-4" style="width: 400px; border-radius: 12px;">
    <h3 class="text-center mb-3 text-primary">Resend Verification</h3>

    <p class="text-muted text-center">Enter your email or username to resend the verification link.</p>

    <!-- ✅ Flash Messages -->
    <div th:if="${error}" class="alert alert-danger text-center py-2" id="errorAlert" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success text-center py-2" id="successAlert" th:text="${message}"></div>

    <form th:action="@{/resend-verification}" method="post">
        <div class="mb-3">
            <input type="text"
                   class="form-control"
                   name="email"
                   placeholder="Enter your username or registered email"
                   th:value="${email}"
                   required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Resend Email</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none">Back to Login</a>
    </div>
</div>

<!-- ✅ Auto-hide alerts after 4 seconds -->
<script>
    setTimeout(() => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            alert.classList.add('fade-out');
            setTimeout(() => alert.style.display = 'none', 500);
        });
    }, 20000);
</script>
</body>
</html>
