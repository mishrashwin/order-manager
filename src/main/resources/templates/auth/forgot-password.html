<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='forgot-password'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page auth-page-split">
<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-brand-icon">
            <i class="bi bi-key"></i>
        </div>
        <h1>Order Manager</h1>
        <p>Manage orders, clients &amp; vendors — all in one place.</p>
    </div>

    <h3>Reset Your Password</h3>

    <div th:if="${message}" class="alert alert-success py-2 small text-center rounded-3" role="alert" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger py-2 small text-center rounded-3" role="alert" th:text="${error}"></div>

    <p class="text-center mb-3" style="font-size: 0.82rem; color: #64748b; line-height: 1.5;">
        Enter your email or username and we'll send a 6-digit verification code.
    </p>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <input type="text" class="form-control" name="email"
                   placeholder="Email or username" required autofocus>
        </div>
        <button type="submit" class="btn-auth-primary">
            <i class="bi bi-send me-1"></i> Send Reset Code
        </button>
    </form>

    <a th:href="@{/login}" class="auth-link">
        <i class="bi bi-arrow-left me-1"></i> Back to Login
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(a => {
            a.style.transition = "opacity 0.5s ease";
            a.style.opacity = "0";
            setTimeout(() => a.style.display = "none", 500);
        });
    }, 20000);
</script>
</body>
</html>
