<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/images/login.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            font-family: "Poppins", sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6%;
        }

        .reset-container {
            width: 100%;
            max-width: 380px;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
        }

        .brand-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-section h1 {
            font-size: 2rem;
            color: #007bff;
            font-weight: 700;
        }

        .brand-section p {
            color: #444;
            font-size: 1rem;
            margin-bottom: 0;
        }

        h3 {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 1.3rem;
        }

        .form-text-muted {
            color: #6c757d;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn-primary-custom {
            width: 100%;
            background-color: #28a745;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-primary-custom:hover {
            background-color: #218838;
        }

        .form-label {
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .password-requirements {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .password-requirements ul {
            margin-bottom: 0;
            padding-left: 1.2rem;
        }

        .password-requirements li {
            margin-bottom: 0.3rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: #1877f2;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding: 0;
            }

            .reset-container {
                max-width: 90%;
                margin: auto;
                padding: 1.8rem;
            }
        }
    </style>
</head>

<body>
<div class="reset-container">
    <div class="brand-section">
        <h1>Order Manager</h1>
        <p>Manage your orders, clients, and vendors — all in one place.</p>
    </div>

    <h3>Create New Password</h3>

    <!-- 🟢 Flash success message -->
    <div th:if="${message}" class="alert alert-success text-center py-2" role="alert"
         style="font-size: 0.95rem; border-radius: 8px;" th:text="${message}"></div>

    <!-- 🔴 Flash error message -->
    <div th:if="${error}" class="alert alert-danger text-center py-2" role="alert"
         style="font-size: 0.95rem; border-radius: 8px;" th:text="${error}"></div>

    <p class="form-text-muted">
        Enter a strong password to secure your account.
    </p>

    <!-- Password Requirements -->
    <div class="password-requirements">
        <strong>Password Requirements:</strong>
        <ul>
            <li>At least 6 characters long</li>
            <li>Passwords must match</li>
        </ul>
    </div>

    <!-- Form -->
    <form th:action="@{/reset-password}" method="post">
        <!-- Hidden code field -->
        <input type="hidden" name="code" th:value="${code}">
        <!-- Hidden email field -->
        <input type="hidden" name="email" th:value="${email}">

        <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter new password"
                   minlength="6"
                   required>
            <small class="form-text text-muted d-block mt-1">Minimum 6 characters</small>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm new password"
                   minlength="6"
                   required>
            <small class="form-text text-muted d-block mt-1">Passwords must match</small>
        </div>

        <button type="submit" class="btn-primary-custom">Reset Password</button>
    </form>

    <a th:href="@{/login}" class="back-link">Back to Login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto-hide alerts after 4 seconds -->
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            alert.style.transition = "opacity 0.5s ease";
            alert.style.opacity = "0";
            setTimeout(() => alert.style.display = "none", 500);
        });
    }, 4000);

    // Real-time password matching validation
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;

        if (confirmPassword && password !== confirmPassword) {
            this.classList.add('is-invalid');
        } else if (confirmPassword && password === confirmPassword) {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
        } else {
            this.classList.remove('is-invalid', 'is-valid');
        }
    });

    // Form submission validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
        }
    });
</script>
</body>
</html>
