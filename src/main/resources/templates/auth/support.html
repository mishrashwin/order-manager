<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='support'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-card { max-width: 480px; }
    </style>
</head>

<body class="auth-page auth-page-split">
<div class="auth-card">
    <div class="auth-brand">
        <div class="auth-brand-icon">
            <i class="bi bi-headset"></i>
        </div>
        <h1>Order Manager</h1>
        <p>Manage orders, clients &amp; vendors — all in one place.</p>
    </div>

    <h3>Contact Support</h3>

    <div th:if="${message}" class="alert alert-success py-2 small text-center rounded-3" role="alert" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger py-2 small text-center rounded-3" role="alert" th:text="${error}"></div>

    <p class="text-center mb-3" style="font-size: 0.82rem; color: #64748b; line-height: 1.5;">
        Having trouble? Fill in the form below and we'll get back to you as soon as possible.
    </p>

    <form th:action="@{/support}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <input type="text" class="form-control" name="name"
                   placeholder="Full Name" required autofocus maxlength="100">
        </div>
        <div class="mb-3">
            <input type="email" class="form-control" name="email"
                   placeholder="Email Address" required maxlength="150">
        </div>
        <div class="mb-3">
            <input type="tel" class="form-control" name="mobile"
                   placeholder="Mobile Number" required maxlength="20">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" name="subject"
                   placeholder="Subject" required maxlength="200">
        </div>
        <div class="mb-3">
            <textarea class="form-control" name="description" rows="4"
                      placeholder="Describe your issue or grievance..." required maxlength="2000"></textarea>
        </div>
        <div class="mb-3">
            <label for="screenshot" class="form-label" style="font-size:0.82rem; color:#64748b;">
                Attach Screenshot <span style="color:#94a3b8;">(optional)</span>
            </label>
            <input type="file" class="form-control" id="screenshot" name="screenshot"
                   accept="image/*,.pdf">
        </div>

        <button type="submit" class="btn-auth-primary">
            <i class="bi bi-send me-1"></i> Submit Request
        </button>
    </form>

    <a th:href="@{/login}" class="auth-link">
        <i class="bi bi-arrow-left me-1"></i> Back to Login
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(a => {
            a.style.transition = "opacity 0.5s ease";
            a.style.opacity = "0";
            setTimeout(() => a.style.display = "none", 500);
        });
    }, 20000);
</script>
</body>
</html>
