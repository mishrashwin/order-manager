<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='vendor-po'">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PO Revisions | Order Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>
<main class="main-content container py-4"><h1>Revision history: <span th:text="${po.poNumber}"></span></h1>
  <table class="table"><thead><tr><th>Revision</th><th>Status</th><th>Created</th><th>Issued</th><th>Action</th></tr></thead><tbody>
    <tr th:each="revision : ${revisions}"><td th:text="${revision.revisionNumber}"></td>
      <td th:text="${revision.status.displayName}"></td><td th:text="${revision.revisionCreatedAt}"></td>
      <td th:text="${revision.issuedPdf != null ? 'PDF saved' : '—'}"></td>
      <td><a class="btn btn-sm btn-outline-primary" th:href="@{/vendor/pos/{id}/download(id=${revision.id})}">PDF</a>
        <a th:if="${revision.status.name() == 'DRAFT'}" class="btn btn-sm btn-primary" th:href="@{/vendor/pos/{id}/edit(id=${revision.id})}">Edit draft</a></td></tr>
  </tbody></table><a class="btn btn-secondary" th:href="@{/vendors#vendor-po}">Back</a>
</main></body></html>
