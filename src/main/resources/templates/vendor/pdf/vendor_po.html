<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>

  <style>

    @page {
      size: A4;
      margin: 18mm;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #2c2c2c;
    }

    .container {
      width: 100%;
    }

    /* TABLE */
    table {
      width: 100%;
      font-size: 11px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #f4f6f8;
      padding: 8px;
      border-bottom: 2px solid #dcdcdc;
      font-weight: 600;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #eeeeee;
      word-wrap: break-word;
    }

    /* UTIL */
    .right {
        text-align: right;
        white-space: nowrap;
     }
    .center { text-align: center; }
    .bold { font-weight: bold; }
    .no-border td { border: none; }
    .top-border { border-top: 2px solid #000; }

    /* HEADER TITLE */
    .title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 10px;
      letter-spacing: 1px;
    }

    /* SECTION SPACING */
    .section {
      margin-top: 15px;
    }

    /* FOOTER */
    .footer {
      margin-top: 50px;
      font-size: 11px;
      text-align: center;
      color: #666;
    }

    /* LIGHT DIVIDER */
    .divider {
      margin: 10px 0;
      border-top: 1px solid #ddd;
    }
    .nowrap {
       white-space: nowrap;
     }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <table class="no-border">
    <tr>

      <!-- LOGO -->
      <td style="width:15%; vertical-align:top;">
        <img th:if="${logoBase64 != null}"
             th:src="${logoBase64}"
             style="height:60px;"/>
      </td>

      <!-- COMPANY -->
      <td style="width:55%; vertical-align:top;">
        <div style="font-size:16px; font-weight:bold;" th:text="${company.name}"></div>

        <div>
          GST: <span th:text="${company.gstn}"></span>
        </div>

        <div style="margin-top:4px; line-height:1.4;"
             th:text="${company.address}">
        </div>
      </td>

      <!-- PO INFO -->
      <td style="width:30%; text-align:right; vertical-align:top;">
        PO #: <span th:text="${vendorPo.poNumber}"></span><br/>
        Date:
        <span th:text="${#temporals.format(vendorPo.createdAt,'dd-MM-yyyy')}"></span>
      </td>

    </tr>
  </table>

  <div class="divider"></div>

  <!-- TITLE -->
  <div class="title">PURCHASE ORDER</div>

  <!-- VENDOR -->
  <table class="no-border section">
    <tr>
      <td>
        <strong>Vendor</strong><br/>
        <span th:text="${#strings.escapeXml(vendorPo.vendorName)}"></span><br/>
        GST: <span th:text="${vendorPo.vendorGstn}"></span>
      </td>

      <td class="right">
        <strong>Delivery Date</strong><br/>
        <span th:text="${vendorPo.deliveryDate}"></span>
      </td>
    </tr>
  </table>

  <!-- ITEMS -->
  <table class="section">
    <thead>
    <tr>
      <th style="width:5%;">#</th>
      <th style="width:30%;">Product</th>
      <th style="width:12%;">HSN</th>
      <th style="width:8%;">Unit</th>
      <th style="width:8%;" class="right">Qty</th>
      <th style="width:10%;" class="right">Rate</th>
      <th style="width:7%;" class="right">GST%</th>
      <th style="width:10%;" class="right">GST Amt</th>
      <th style="width:10%;" class="right">Amount</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item, iter : ${vendorPo.items}">
      <td th:text="${iter.index + 1}"></td>
      <td th:text="${#strings.escapeXml(item.productName)}"></td>
      <td th:text="${item.hsnCode}"></td>
      <td th:text="${item.unit}"></td>
      <td class="right" th:text="${item.quantity}"></td>
      <td class="right" th:text="${item.formattedTaxableRate != null ? item.formattedTaxableRate : item.unitPrice}"></td>

      <!-- GST % (NO DECIMAL) -->
      <td class="right"
          th:text="${item.gstPercentage != null ? item.gstPercentage.intValue() : 0}">
      </td>

      <td class="right"
          th:text="${item.formattedGstAmount != null ? item.formattedGstAmount : '0.00'}">
      </td>

      <td class="right" th:text="${item.formattedLineTotal != null ? item.formattedLineTotal : item.lineTotal}"></td>
    </tr>
    </tbody>
  </table>

  <!-- TOTAL -->
  <table class="section">
    <tr>
      <td style="width:60%;"></td>

      <td style="width:40%;">
        <table>

          <tr>
            <td>Subtotal</td>
            <td class="right" th:text="${subtotal}"></td>
          </tr>

          <!-- INTRA STATE: CGST + SGST -->
          <tr th:if="${isIntraState}">
            <td>CGST</td>
            <td class="right" th:text="${cgst}"></td>
          </tr>

          <tr th:if="${isIntraState}">
            <td>SGST</td>
            <td class="right" th:text="${sgst}"></td>
          </tr>

          <!-- INTER STATE: IGST -->
          <tr th:if="${!isIntraState}">
            <td>IGST</td>
            <td class="right" th:text="${igst}"></td>
          </tr>

          <tr class="bold top-border">
            <td>Total</td>
            <td class="right" th:text="${finalTotal}"></td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

  <!-- AMOUNT IN WORDS -->
  <div class="section">
    <strong>Amount in Words:</strong>
    <span th:text="${amountInWords}"></span>
  </div>

  <!-- NOTES -->
  <div class="section">
    <strong>Notes &amp; Terms</strong>
    <p th:text="${#strings.escapeXml(vendorPo.note)}"></p>
  </div>

  <!-- SIGN -->
  <table class="no-border section">
    <tr>
      <td style="width:60%;"></td>

      <td class="center">
        <img th:if="${signatureBase64 != null}"
             th:src="${signatureBase64}"
             style="height:90px; margin-top:10px;" />

        <div th:if="${signatureBase64 == null}">
          _______________________
        </div>

        <div style="margin-top:5px;">Authorized Signatory</div>
      </td>
    </tr>
  </table>

  <!-- FOOTER -->
  <div class="footer">
    This is a system-generated Purchase Order.
  </div>

</div>

</body>
</html>
