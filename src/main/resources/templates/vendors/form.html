<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='vendors'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vendor.id == null ? 'Add Vendor' : 'Edit Vendor'}">Vendor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-building"></i>
            <span th:text="${vendor.id == null ? 'Add New Vendor' : 'Edit Vendor'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="@{/vendors}">
            <i class="bi bi-arrow-left"></i> Back to Vendors
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <form th:action="@{/vendors}" th:object="${vendor}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-building"></i> Company Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{companyName}" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person"></i> Contact Person</label>
                <input type="text" class="form-control form-control-custom" th:field="*{contactPerson}">
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                    <input type="email" class="form-control form-control-custom" th:field="*{email}">
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-telephone"></i> Phone</label>
                    <input type="text" class="form-control form-control-custom" th:field="*{phone}">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-geo-alt"></i> Address</label>
                <textarea class="form-control form-control-custom" th:field="*{address}" rows="3"></textarea>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/vendors}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button type="submit" class="btn btn-success-custom">
                    <i class="bi bi-check-circle"></i> Save Vendor
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
