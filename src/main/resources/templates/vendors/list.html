<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='vendors'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendors | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-building"></i> Vendor Management</h1>
        <a class="btn btn-success-custom" th:href="@{/vendors/new}">
            <i class="bi bi-plus-circle"></i> Add New Vendor
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search & Filters -->
    <div class="search-box om-list-toolbar">
        <div class="om-list-toolbar-row">
            <input type="text" id="searchInput" class="form-control-custom om-list-search-input"
                   placeholder="🔍 Search vendors by company, contact, email, phone...">
            <div class="om-list-actions">
                <button id="resetSortBtn" class="btn btn-outline-secondary om-btn-icon">
                <i class="bi bi-arrow-clockwise"></i> Reset Sort
                </button>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(vendors)}" class="empty-state">
        <i class="bi bi-shop"></i>
        <h4>No vendors found</h4>
        <p>Get started by adding your first vendor</p>
        <a th:href="@{/vendors/new}" class="btn btn-success-custom">
            <i class="bi bi-plus-circle"></i> Add First Vendor
        </a>
    </div>

    <!-- Vendors Table -->
    <div th:if="${!#lists.isEmpty(vendors)}" class="unified-card">
        <div class="table-responsive">
            <table class="table unified-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="om-sortable">#</th>
                    <th class="om-sortable">Company Name</th>
                    <th class="om-sortable">Contact Person</th>
                    <th class="om-sortable">Email</th>
                    <th class="om-sortable">Phone</th>
                    <th class="om-sortable">Address</th>
                    <th class="text-center no-sort">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vendor, iterStat : ${vendors}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td><strong th:text="${vendor.companyName}"></strong></td>
                    <td th:text="${vendor.contactPerson}"></td>
                    <td><i class="bi bi-envelope"></i> <span th:text="${vendor.email}"></span></td>
                    <td><i class="bi bi-telephone"></i> <span th:text="${!#strings.isEmpty(vendor.phone) ? '+' + vendor.phone : ''}"></span></td>
                    <td th:text="${vendor.address}"></td>
                    <td class="text-center">
                        <div class="action-buttons om-action-group">
                            <a th:href="@{|/vendors/edit/${vendor.id}|}"
                               class="btn btn-sm btn-outline-primary om-btn-icon"
                               title="Edit vendor">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'')')}"
                                    type="button"
                                    class="btn btn-sm btn-outline-danger om-btn-icon"
                                    data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal"
                                    th:data-delete-url="@{|/vendors/delete/${vendor.id}|}"
                                    th:data-entity-label="${vendor.companyName}"
                                    title="Delete vendor">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="unified-card-body">
            <p class="text-muted-custom mb-0">
                <i class="bi bi-info-circle"></i> Total Vendors: <strong th:text="${vendors.size()}"></strong>
            </p>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Table Utility JS -->
<div th:replace="~{fragments/table-utils :: tableUtils}"></div>

<!-- Password Confirmation Modal -->
<div th:replace="~{fragments/confirm-delete-modal :: confirmDeleteModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
