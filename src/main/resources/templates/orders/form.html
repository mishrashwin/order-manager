<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='orders'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${order.id == null ? 'Add Order' : 'Edit Order'}">Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-box-seam"></i>
            <span th:text="${order.id == null ? 'Create New Order' : 'Edit Order'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="@{/orders}">
            <i class="bi bi-arrow-left"></i> Back to Orders
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form id="orderForm" th:action="${order.id == null} ? @{/orders} : @{/orders/update/{id}(id=${order.id})}" th:object="${order}" method="post">
            <input type="hidden" th:field="*{id}">

            <!-- Customer Selection -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person"></i> Customer Name <span class="text-danger">*</span></label>
                <div class="input-group">
                    <select class="form-select form-control-custom" th:field="*{client.id}" required>
                        <option value="">-- Select Client --</option>
                        <option th:each="client : ${clients}"
                                th:value="${client.id}"
                                th:text="${client.name}"
                                th:selected="${order.client != null && order.client.id == client.id}">
                        </option>
                    </select>
                    <a id="addClientLink" class="btn btn-outline-success"
                       th:href="@{/clients/new(returnTo=${order.id == null ? '/orders/new' : '/orders/edit/' + order.id})}">
                        <i class="bi bi-plus-circle"></i> Add Client
                    </a>
                </div>
                <small class="form-text text-muted">If the desired client is missing, click "Add Client".</small>
            </div>

            <!-- PO/Order No -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-receipt"></i> PO/Order No <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" th:field="*{poOrderNo}" placeholder="e.g., PO-2026-001" required>
            </div>

            <!-- Product Items -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-boxes"></i> Products <span class="text-danger">*</span></label>
                <div id="productRows">
                    <!-- Existing order items (for edit) -->
                    <div th:each="item, itemStat : ${order.orderItems}"
                         class="product-row row g-2 mb-2 align-items-center">
                        <div class="col-md-3">
                            <select class="form-select form-control-custom" name="itemProductIds" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name + (p.brand != null ? ' (' + p.brand + ')' : '')}"
                                        th:attr="data-price=${p.price != null ? p.price : ''}, data-hsn=${p.hsnCode}, data-unit=${p.unit}, data-gst=${p.gstPercentage != null ? p.gstPercentage : ''}"
                                        th:selected="${item.product != null and item.product.id == p.id}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control form-control-custom"
                                   name="itemQuantities" min="1" placeholder="Qty" required
                                   th:value="${item.quantity}">
                        </div>
                        <div class="col-md-2">
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control form-control-custom"
                                       name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price" required
                                       th:value="${item.unitPrice}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="HSN Code"
                                   th:value="${item.product != null ? item.product.hsnCode : ''}">
                        </div>
                        <div class="col-md-1">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="Unit"
                                   th:value="${item.product != null ? item.product.unit : ''}">
                        </div>
                        <div class="col-md-1">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="GST %"
                                   th:value="${item.product != null && item.product.gstPercentage != null ? #numbers.formatDecimal(item.product.gstPercentage, 1, 2) + '%' : ''}">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                                <i class="bi bi-dash-circle"></i> Remove
                            </button>
                        </div>
                    </div>
                    <!-- Default empty row for new orders (no existing items) -->
                    <div th:if="${order.orderItems == null or order.orderItems.isEmpty()}"
                         class="product-row row g-2 mb-2 align-items-center">
                        <div class="col-md-3">
                            <select class="form-select form-control-custom" name="itemProductIds" required>
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name + (p.brand != null ? ' (' + p.brand + ')' : '')}"
                                        th:attr="data-price=${p.price != null ? p.price : ''}, data-hsn=${p.hsnCode}, data-unit=${p.unit}, data-gst=${p.gstPercentage != null ? p.gstPercentage : ''}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control form-control-custom"
                                   name="itemQuantities" min="1" placeholder="Qty" required>
                        </div>
                        <div class="col-md-2">
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control form-control-custom"
                                       name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price" required>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="HSN Code">
                        </div>
                        <div class="col-md-1">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="Unit">
                        </div>
                        <div class="col-md-1">
                            <input type="text" class="form-control form-control-custom"
                                   readonly placeholder="GST %">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                                <i class="bi bi-dash-circle"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-2">
                    <button type="button" id="addProductRowBtn" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-plus-circle"></i> Add Another Product
                    </button>
                    <a id="addProductLink" class="btn btn-outline-secondary btn-sm"
                       th:href="@{/products/new(returnTo=${order.id == null ? '/orders/new' : '/orders/edit/' + order.id})}">
                        <i class="bi bi-plus-circle"></i> New Product
                    </a>
                </div>
                <small class="form-text text-muted">Select existing products or
                    <a th:href="@{/products/new(returnTo=${order.id == null ? '/orders/new' : '/orders/edit/' + order.id})}">create a new product</a>.
                </small>
            </div>

            <!-- Legacy product name (hidden, auto-synced on save) -->
            <input type="hidden" th:field="*{productName}">
            <input type="hidden" th:field="*{quantity}">
            <input type="hidden" th:field="*{totalAmount}">

            <!-- Derived Order Summary + Status -->
            <div class="row">
                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-hash"></i> Total Qty</label>
                    <div class="form-control form-control-custom d-flex align-items-center bg-light-subtle" id="orderQuantitySummary">0</div>
                </div>

                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-currency-rupee"></i> Calculated Total Amount</label>
                    <div class="form-control form-control-custom d-flex align-items-center bg-light-subtle" id="orderTotalAmountSummary">₹0.00</div>
                </div>

                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-tag"></i> Status <span class="text-danger">*</span></label>
                    <select class="form-select form-control-custom" th:field="*{status}" required>
                        <option value="">-- Select Status --</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status.name()}"
                                th:text="${status.displayName}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Dates Row -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-calendar"></i> Order Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control form-control-custom"
                           th:field="*{orderDate}"
                           th:value="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}" required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-calendar-check"></i> Delivery Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control form-control-custom"
                           th:classappend="${dateError} ? ' is-invalid' : ''"
                           th:field="*{deliveryDate}"
                           th:value="${#temporals.format(order.deliveryDate, 'yyyy-MM-dd')}" required>
                    <div th:if="${dateError}" class="invalid-feedback d-block" th:text="${dateError}"></div>
                    <div id="dateClientError" class="invalid-feedback d-block" style="display: none;">
                        Delivery date must be on or after order date.
                    </div>
                </div>
            </div>

            <!-- Order Note -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-chat-left-text"></i> Order Note</label>
                <textarea class="form-control form-control-custom" th:field="*{orderNote}"
                          rows="5" placeholder="Add any notes related to this order (internal use only)..."></textarea>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/orders}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button id="orderSubmitBtn" type="submit" class="btn btn-success-custom" disabled>
                    <i class="bi bi-check-circle"></i> <span th:text="${order.id == null ? 'Save Order' : 'Update Order'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const orderDraftStorageKey = 'om:draft:order:' + window.location.pathname + window.location.search;
    const orderDraftTtlMs = 8 * 60 * 60 * 1000;

    function saveOrderDraft() {
        const form = document.getElementById('orderForm');
        const productRows = document.getElementById('productRows');
        if (!form || !productRows) {
            return;
        }

        const values = {};
        form.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (field) {
            if (field.closest('#productRows')) {
                return;
            }
            values[field.name] = field.value;
        });

        const draft = {
            updatedAt: Date.now(),
            values: values,
            productRows: collectProductRows()
        };

        sessionStorage.setItem(orderDraftStorageKey, JSON.stringify(draft));
    }

    function restoreOrderDraft() {
        const rawDraft = sessionStorage.getItem(orderDraftStorageKey);
        if (!rawDraft) {
            return;
        }

        try {
            const draft = JSON.parse(rawDraft);
            if (!draft.updatedAt || (Date.now() - draft.updatedAt) > orderDraftTtlMs) {
                sessionStorage.removeItem(orderDraftStorageKey);
                return;
            }

            if (draft.productRows && Array.isArray(draft.productRows) && draft.productRows.length > 0) {
                renderProductRows(draft.productRows);
            }

            if (draft.values) {
                Object.keys(draft.values).forEach(function (name) {
                    const field = document.querySelector('#orderForm [name="' + name + '"]');
                    if (field) {
                        field.value = draft.values[name];
                    }
                });
            }
        } catch (error) {
            sessionStorage.removeItem(orderDraftStorageKey);
        }
    }

    function collectProductRows() {
        return Array.from(document.querySelectorAll('#productRows .product-row')).map(function (row) {
            const productSelect = row.querySelector('select[name="itemProductIds"]');
            const qtyInput = row.querySelector('input[name="itemQuantities"]');
            const priceInput = row.querySelector('input[name="itemUnitPrices"]');

            return {
                productId: productSelect ? productSelect.value : '',
                quantity: qtyInput ? qtyInput.value : '',
                unitPrice: priceInput ? priceInput.value : ''
            };
        });
    }

    // Template for a blank product row (cloned when adding more rows)
    const productRowTemplate = `
        <div class="product-row row g-2 mb-2 align-items-center">
            <div class="col-md-3">
                <select class="form-select form-control-custom" name="itemProductIds" required>
                    <option value="">-- Select Product --</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control form-control-custom"
                       name="itemQuantities" min="1" placeholder="Qty" required>
            </div>
            <div class="col-md-2">
                <div class="input-group">
                    <span class="input-group-text">₹</span>
                    <input type="number" class="form-control form-control-custom"
                           name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price" required>
                </div>
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control form-control-custom"
                       readonly placeholder="HSN Code">
            </div>
            <div class="col-md-1">
                <input type="text" class="form-control form-control-custom"
                       readonly placeholder="Unit">
            </div>
            <div class="col-md-1">
                <input type="text" class="form-control form-control-custom"
                       readonly placeholder="GST %">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                    <i class="bi bi-dash-circle"></i> Remove
                </button>
            </div>
        </div>`;

    // Collect product options from the first existing select
    function getProductOptions() {
        const firstSelect = document.querySelector('#productRows select[name="itemProductIds"]');
        return firstSelect ? firstSelect.innerHTML : '';
    }

    function createProductRow(rowData, productOptionsHtml) {
        const div = document.createElement('div');
        div.innerHTML = productRowTemplate;
        const newRow = div.firstElementChild;
        const newSelect = newRow.querySelector('select[name="itemProductIds"]');
        const qtyInput = newRow.querySelector('input[name="itemQuantities"]');
        const priceInput = newRow.querySelector('input[name="itemUnitPrices"]');

        if (newSelect) {
            newSelect.innerHTML = productOptionsHtml || getProductOptions();
            if (rowData && rowData.productId) {
                newSelect.value = rowData.productId;
            }
        }
        if (qtyInput && rowData && rowData.quantity) {
            qtyInput.value = rowData.quantity;
        }
        if (priceInput && rowData && rowData.unitPrice) {
            priceInput.value = rowData.unitPrice;
        }

        return newRow;
    }

    function renderProductRows(rows) {
        const container = document.getElementById('productRows');
        if (!container) {
            return;
        }

        const rowsToRender = rows && rows.length > 0 ? rows : [{}];
        const productOptionsHtml = getProductOptions();
        container.innerHTML = '';
        rowsToRender.forEach(function (rowData) {
            container.appendChild(createProductRow(rowData, productOptionsHtml));
        });
    }

    function recalculateOrderSummary() {
        let totalQty = 0;
        let totalAmount = 0;

        document.querySelectorAll('#productRows .product-row').forEach(function (row) {
            const qtyInput = row.querySelector('input[name="itemQuantities"]');
            const unitPriceInput = row.querySelector('input[name="itemUnitPrices"]');
            const qty = parseInt(qtyInput ? qtyInput.value : '0', 10);
            const unitPrice = parseFloat(unitPriceInput ? unitPriceInput.value : '0');

            if (!Number.isNaN(qty) && qty > 0) {
                totalQty += qty;
                totalAmount += qty * (Number.isNaN(unitPrice) ? 0 : unitPrice);
            }
        });

        const quantitySummary = document.getElementById('orderQuantitySummary');
        const amountSummary = document.getElementById('orderTotalAmountSummary');
        const quantityField = document.getElementById('quantity');
        const totalAmountField = document.getElementById('totalAmount');

        if (quantitySummary) {
            quantitySummary.textContent = String(totalQty);
        }
        if (amountSummary) {
            amountSummary.textContent = '₹' + totalAmount.toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        if (quantityField) {
            quantityField.value = totalQty > 0 ? String(totalQty) : '';
        }
        if (totalAmountField) {
            totalAmountField.value = totalAmount > 0 ? totalAmount.toFixed(2) : '0.00';
        }
    }

    function validateOrderDatesOnClient() {
        const orderDateInput = document.getElementById('orderDate');
        const deliveryDateInput = document.getElementById('deliveryDate');
        const dateClientError = document.getElementById('dateClientError');

        if (!orderDateInput || !deliveryDateInput || !dateClientError) {
            return true;
        }

        deliveryDateInput.setCustomValidity('');
        dateClientError.style.display = 'none';

        if (!orderDateInput.value || !deliveryDateInput.value) {
            deliveryDateInput.classList.remove('is-invalid');
            return true;
        }

        if (deliveryDateInput.value < orderDateInput.value) {
            const message = 'Delivery date must be on or after order date.';
            deliveryDateInput.classList.add('is-invalid');
            deliveryDateInput.setCustomValidity(message);
            dateClientError.textContent = message;
            dateClientError.style.display = 'block';
            return false;
        }

        deliveryDateInput.classList.remove('is-invalid');
        return true;
    }

    function areMandatoryOrderFieldsFilled() {
        const clientSelect = document.querySelector('#orderForm select[name="client.id"]');
        const poInput = document.getElementById('poOrderNo');
        const statusSelect = document.getElementById('status');
        const orderDateInput = document.getElementById('orderDate');
        const deliveryDateInput = document.getElementById('deliveryDate');

        const headerFieldsValid = !!(clientSelect && clientSelect.value
            && poInput && poInput.value.trim()
            && statusSelect && statusSelect.value
            && orderDateInput && orderDateInput.value
            && deliveryDateInput && deliveryDateInput.value);

        if (!headerFieldsValid) {
            return false;
        }

        const rows = document.querySelectorAll('#productRows .product-row');
        if (!rows.length) {
            return false;
        }

        return Array.from(rows).every(function (row) {
            const productSelect = row.querySelector('select[name="itemProductIds"]');
            const qtyInput = row.querySelector('input[name="itemQuantities"]');
            const priceInput = row.querySelector('input[name="itemUnitPrices"]');

            return !!(productSelect && productSelect.value
                && qtyInput && qtyInput.value && Number(qtyInput.value) > 0
                && priceInput && priceInput.value !== '' && Number(priceInput.value) >= 0);
        });
    }

    function updateOrderSubmitState() {
        const submitButton = document.getElementById('orderSubmitBtn');
        if (!submitButton) {
            return;
        }
        submitButton.disabled = !(areMandatoryOrderFieldsFilled() && validateOrderDatesOnClient());
    }

    document.addEventListener('DOMContentLoaded', function () {
        restoreOrderDraft();
        recalculateOrderSummary();
        updateOrderSubmitState();

        const orderForm = document.getElementById('orderForm');
        if (orderForm) {
            orderForm.addEventListener('input', saveOrderDraft);
            orderForm.addEventListener('change', saveOrderDraft);
            orderForm.addEventListener('input', updateOrderSubmitState);
            orderForm.addEventListener('change', updateOrderSubmitState);
            orderForm.addEventListener('submit', function (event) {
                if (!validateOrderDatesOnClient()) {
                    event.preventDefault();
                    document.getElementById('deliveryDate').reportValidity();
                    return;
                }
                if (!areMandatoryOrderFieldsFilled()) {
                    event.preventDefault();
                    updateOrderSubmitState();
                    return;
                }
                recalculateOrderSummary();
                sessionStorage.removeItem(orderDraftStorageKey);
            });
        }

        ['orderDate', 'deliveryDate'].forEach(function (fieldId) {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('change', function () {
                    validateOrderDatesOnClient();
                    updateOrderSubmitState();
                });
            }
        });

        // Auto-fill unit price, HSN code, unit, and GST% when a product is selected
        document.getElementById('productRows').addEventListener('change', function (e) {
            if (e.target.matches('select[name="itemProductIds"]')) {
                const row = e.target.closest('.product-row');
                const priceInput = row ? row.querySelector('input[name="itemUnitPrices"]') : null;
                const hsnInput = row ? row.querySelector('input[placeholder="HSN Code"]') : null;
                const unitInput = row ? row.querySelector('input[placeholder="Unit"]') : null;
                const gstInput = row ? row.querySelector('input[placeholder="GST %"]') : null;
                const selectedOption = e.target.selectedOptions[0];
                const price = selectedOption ? selectedOption.getAttribute('data-price') : null;
                const hsnCode = selectedOption ? selectedOption.getAttribute('data-hsn') : null;
                const unit = selectedOption ? selectedOption.getAttribute('data-unit') : null;
                const gst = selectedOption ? selectedOption.getAttribute('data-gst') : null;

                if (priceInput && price != null) {
                    priceInput.value = price;
                }
                if (hsnInput && hsnCode != null) {
                    hsnInput.value = hsnCode;
                }
                if (unitInput && unit != null) {
                    unitInput.value = unit;
                }
                if (gstInput && gst != null) {
                    gstInput.value = gst + '%';
                }
                recalculateOrderSummary();
                saveOrderDraft();
                updateOrderSubmitState();
            }
        });

        document.getElementById('productRows').addEventListener('input', function () {
            recalculateOrderSummary();
            saveOrderDraft();
            updateOrderSubmitState();
        });

        // Remove product row
        document.getElementById('productRows').addEventListener('click', function (e) {
            if (e.target.closest('.remove-product-row')) {
                const rows = document.querySelectorAll('#productRows .product-row');
                if (rows.length > 1) {
                    e.target.closest('.product-row').remove();
                    recalculateOrderSummary();
                    saveOrderDraft();
                    updateOrderSubmitState();
                }
            }
        });

        // Add another product row
        document.getElementById('addProductRowBtn').addEventListener('click', function () {
            const container = document.getElementById('productRows');
            container.appendChild(createProductRow({}, getProductOptions()));
            recalculateOrderSummary();
            saveOrderDraft();
            updateOrderSubmitState();
        });

        const addProductLink = document.getElementById('addProductLink');
        if (addProductLink) {
            addProductLink.addEventListener('click', function (e) {
                e.preventDefault();
                saveOrderDraft();
                window.location.href = addProductLink.href;
            });
        }

        const addClientLink = document.getElementById('addClientLink');
        if (addClientLink) {
            addClientLink.addEventListener('click', function (e) {
                e.preventDefault();
                saveOrderDraft();
                window.location.href = addClientLink.href;
            });
        }

        document.querySelectorAll('a[href="/orders"]').forEach(function (link) {
            link.addEventListener('click', function () {
                sessionStorage.removeItem(orderDraftStorageKey);
            });
        });
    });
</script>
</body>
</html>
