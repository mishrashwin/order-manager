<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='orders'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${order.id == null ? 'Add Order' : 'Edit Order'}">Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-box-seam"></i>
            <span th:text="${order.id == null ? 'Create New Order' : 'Edit Order'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="@{/orders}">
            <i class="bi bi-arrow-left"></i> Back to Orders
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="${order.id == null} ? @{/orders} : @{/orders/update/{id}(id=${order.id})}" th:object="${order}" method="post">
            <input type="hidden" th:field="*{id}">

            <!-- Customer Selection -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person"></i> Customer Name</label>
                <div class="input-group">
                    <select class="form-select form-control-custom" th:field="*{client.id}" required>
                        <option value="">-- Select Client --</option>
                        <option th:each="client : ${clients}"
                                th:value="${client.id}"
                                th:text="${client.name}"
                                th:selected="${order.client != null && order.client.id == client.id}">
                        </option>
                    </select>
                    <a class="btn btn-outline-success" th:href="@{/clients/new}" target="_blank">
                        <i class="bi bi-plus-circle"></i> Add Client
                    </a>
                </div>
                <small class="form-text text-muted">If the desired client is missing, click "Add Client".</small>
            </div>

            <!-- PO/Order No -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-receipt"></i> PO/Order No</label>
                <input type="text" class="form-control form-control-custom" th:field="*{poOrderNo}" placeholder="e.g., PO-2026-001">
            </div>

            <!-- Product Items -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-boxes"></i> Products</label>
                <div id="productRows">
                    <!-- Existing order items (for edit) -->
                    <div th:each="item, itemStat : ${order.orderItems}"
                         class="product-row row g-2 mb-2 align-items-center">
                        <div class="col-md-5">
                            <select class="form-select form-control-custom" name="itemProductIds">
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name + (p.brand != null ? ' (' + p.brand + ')' : '')}"
                                        th:selected="${item.product != null and item.product.id == p.id}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control form-control-custom"
                                   name="itemQuantities" min="1" placeholder="Qty"
                                   th:value="${item.quantity}">
                        </div>
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control form-control-custom"
                                       name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price"
                                       th:value="${item.unitPrice}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                                <i class="bi bi-dash-circle"></i> Remove
                            </button>
                        </div>
                    </div>
                    <!-- Default empty row for new orders (no existing items) -->
                    <div th:if="${order.orderItems == null or order.orderItems.isEmpty()}"
                         class="product-row row g-2 mb-2 align-items-center">
                        <div class="col-md-5">
                            <select class="form-select form-control-custom" name="itemProductIds">
                                <option value="">-- Select Product --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name + (p.brand != null ? ' (' + p.brand + ')' : '')}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control form-control-custom"
                                   name="itemQuantities" min="1" placeholder="Qty">
                        </div>
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control form-control-custom"
                                       name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                                <i class="bi bi-dash-circle"></i> Remove
                            </button>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-2">
                    <button type="button" id="addProductRowBtn" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-plus-circle"></i> Add Another Product
                    </button>
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/products/new}" target="_blank">
                        <i class="bi bi-plus-circle"></i> New Product
                    </a>
                </div>
                <small class="form-text text-muted">Select existing products or <a th:href="@{/products/new}" target="_blank">create a new product</a>.</small>
            </div>

            <!-- Legacy product name (hidden, auto-synced on save) -->
            <input type="hidden" th:field="*{productName}">

            <!-- Order Details Row -->
            <div class="row">
                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-hash"></i> Quantity</label>
                    <input type="number" class="form-control form-control-custom" th:field="*{quantity}" min="1" required>
                </div>

                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-currency-rupee"></i> Total Amount</label>
                    <input type="number" class="form-control form-control-custom" th:field="*{totalAmount}" step="0.01" min="0" required>
                </div>

                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-tag"></i> Status</label>
                    <select class="form-select form-control-custom" th:field="*{status}" required>
                        <option value="">-- Select Status --</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status.name()}"
                                th:text="${status.displayName}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Dates Row -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-calendar"></i> Order Date</label>
                    <input type="date" class="form-control form-control-custom"
                           th:field="*{orderDate}"
                           th:value="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}">
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-calendar-check"></i> Delivery Date</label>
                    <input type="date" class="form-control form-control-custom"
                           th:field="*{deliveryDate}"
                           th:value="${#temporals.format(order.deliveryDate, 'yyyy-MM-dd')}">
                </div>
            </div>

            <!-- Order Note -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-chat-left-text"></i> Order Note</label>
                <textarea class="form-control form-control-custom" th:field="*{orderNote}"
                          rows="5" placeholder="Add any notes related to this order (internal use only)..."></textarea>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/orders}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button type="submit" class="btn btn-success-custom">
                    <i class="bi bi-check-circle"></i> <span th:text="${order.id == null ? 'Save Order' : 'Update Order'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // Product price map: id -> price (injected by Thymeleaf)
    const productPriceMap = {};
    /*[# th:each="p : ${products}"]*/
    productPriceMap[/*[[${p.id}]]*/ 0] = /*[[${p.price}]]*/ null;
    /*[/]*/

    // Template for a blank product row (cloned when adding more rows)
    const productRowTemplate = `
        <div class="product-row row g-2 mb-2 align-items-center">
            <div class="col-md-5">
                <select class="form-select form-control-custom" name="itemProductIds">
                    <option value="">-- Select Product --</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control form-control-custom"
                       name="itemQuantities" min="1" placeholder="Qty">
            </div>
            <div class="col-md-3">
                <div class="input-group">
                    <span class="input-group-text">₹</span>
                    <input type="number" class="form-control form-control-custom"
                           name="itemUnitPrices" step="0.01" min="0" placeholder="Unit Price">
                </div>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-danger btn-sm remove-product-row">
                    <i class="bi bi-dash-circle"></i> Remove
                </button>
            </div>
        </div>`;

    // Collect product options from the first existing select
    function getProductOptions() {
        const firstSelect = document.querySelector('#productRows select[name="itemProductIds"]');
        return firstSelect ? firstSelect.innerHTML : '';
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Auto-fill unit price when a product is selected
        document.getElementById('productRows').addEventListener('change', function (e) {
            if (e.target.matches('select[name="itemProductIds"]')) {
                const row = e.target.closest('.product-row');
                const priceInput = row ? row.querySelector('input[name="itemUnitPrices"]') : null;
                const selectedId = parseInt(e.target.value);
                if (priceInput && selectedId && selectedId in productPriceMap && productPriceMap[selectedId] != null) {
                    priceInput.value = productPriceMap[selectedId];
                }
            }
        });

        // Remove product row
        document.getElementById('productRows').addEventListener('click', function (e) {
            if (e.target.closest('.remove-product-row')) {
                const rows = document.querySelectorAll('#productRows .product-row');
                if (rows.length > 1) {
                    e.target.closest('.product-row').remove();
                }
            }
        });

        // Add another product row
        document.getElementById('addProductRowBtn').addEventListener('click', function () {
            const container = document.getElementById('productRows');
            const div = document.createElement('div');
            div.innerHTML = productRowTemplate;
            const newRow = div.firstElementChild;
            // Copy product options into new row's select
            const newSelect = newRow.querySelector('select[name="itemProductIds"]');
            if (newSelect) {
                newSelect.innerHTML = getProductOptions();
            }
            container.appendChild(newRow);
        });
    });
</script>
</html>
