<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='orders'">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-box-seam"></i> Order Management</h1>
        <a class="btn btn-success-custom" th:href="@{/orders/new}">
            <i class="bi bi-plus-circle"></i> Create New Order
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search & Filters -->
    <div class="search-box om-list-toolbar">
        <div class="row g-2 align-items-center">
            <!-- Left Half: Search -->
            <div class="col-md-5">
                <div class="d-flex gap-2">
                    <input type="text" id="searchInput" class="form-control form-control-sm om-list-search-input"
                           placeholder="🔍 Search orders...">
                </div>
            </div>

            <!-- Right Half: Date Range Filter -->
            <div class="col-md-7">
                <form method="get" action="/orders" class="om-date-range">
                    <input type="date" class="form-control form-control-sm date-input" id="startDate" name="startDate"
                           th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}"
                           title="Start Date" required>
                    <span class="text-muted small">to</span>
                    <input type="date" class="form-control form-control-sm date-input" id="endDate" name="endDate"
                           th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}"
                           title="End Date" required>
                    <button type="submit" class="btn btn-sm btn-primary om-btn-icon" title="Apply Date Filter">
                        <i class="bi bi-funnel"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary om-btn-icon" onclick="resetDateRange()" title="Reset Date Range">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                    <button type="button" id="resetSortBtn" class="btn btn-sm btn-outline-secondary om-btn-icon" title="Reset Table Sort">
                        <i class="bi bi-sort-up"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h4>No orders found</h4>
        <p>Get started by creating your first order</p>
        <a th:href="@{/orders/new}" class="btn btn-success-custom">
            <i class="bi bi-plus-circle"></i> Create First Order
        </a>
    </div>

    <!-- Orders Table -->
    <div th:if="${!#lists.isEmpty(orders)}" class="unified-card">
        <div class="table-responsive">
            <table class="table unified-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="om-sortable">#</th>
                    <th class="om-sortable">Client</th>
                    <th class="om-sortable">PO/Order No</th>
                    <th class="om-sortable">Product</th>
                    <th class="text-end om-sortable">Order Value</th>
                    <th class="om-sortable">Status</th>
                    <th class="om-sortable">Order Date</th>
                    <th class="om-sortable">Delivery Date</th>
                    <th class="text-center no-sort">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order, iterStat : ${orders}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td><strong th:text="${order.customerName}"></strong></td>
                    <td th:text="${order.poOrderNo != null ? order.poOrderNo : '-'}"></td>
                    <td th:text="${order.displayProductSummary}"></td>
                    <td class="text-end">
                        <strong th:text="${'₹' + #numbers.formatDecimal(order.totalAmount != null ? order.totalAmount : 0, 0, 'COMMA', 2, 'POINT')}"></strong>
                    </td>
                    <td>
                        <span th:class="'badge badge-custom bg-' + ${order.status.badgeColor}"
                              th:text="${order.status.displayName}">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}"></td>
                    <td th:text="${order.deliveryDate != null ? #temporals.format(order.deliveryDate, 'dd MMM yyyy') : '-'}"></td>
                    <td class="text-center">
                        <div class="action-buttons om-action-group">
                            <a th:href="@{|/orders/edit/${order.id}|}"
                               class="btn btn-sm btn-outline-primary om-btn-icon"
                               title="Edit order">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a th:href="@{|/orders/duplicate/${order.id}|}"
                               class="btn btn-sm btn-outline-info om-btn-icon"
                               title="Duplicate order">
                                <i class="bi bi-files"></i> Duplicate
                            </a>
                            <button th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'')')}"
                                    type="button"
                                    class="btn btn-sm btn-outline-danger om-btn-icon"
                                    data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal"
                                    th:data-delete-url="@{|/orders/delete/${order.id}|}"
                                    th:data-entity-label="${'Order #' + order.id + (order.productName != null ? ' (' + order.productName + ')' : '')}"
                                    title="Delete order">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="unified-card-body">
            <p class="text-muted-custom mb-0">
                <i class="bi bi-info-circle"></i> Total Orders: <strong th:text="${orders.size()}"></strong>
            </p>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Table Utility JS -->
<div th:replace="~{fragments/table-utils :: tableUtils}"></div>

<!-- Password Confirmation Modal -->
<div th:replace="~{fragments/confirm-delete-modal :: confirmDeleteModal}"></div>

<script>
  // Reset date range to default (past one month)
  function resetDateRange() {
    const today = new Date();
    const oneMonthAgo = new Date(today);
    oneMonthAgo.setMonth(today.getMonth() - 1);

    const formatDate = (date) => date.toISOString().split('T')[0];

    window.location.href = `/orders?startDate=${formatDate(oneMonthAgo)}&endDate=${formatDate(today)}`;
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
