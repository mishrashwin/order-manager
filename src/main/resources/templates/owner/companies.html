<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='owner-companies'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management | Owner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<div class="main-content">
    <div class="content-header d-flex justify-content-between align-items-center">
        <div>
            <h1><i class="bi bi-buildings"></i> Company Management</h1>
            <p class="text-muted mb-0">Pending approvals: <strong th:text="${pendingCount}">0</strong></p>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

    <div class="card mt-3">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Company</th>
                        <th>Status</th>
                        <th>Access</th>
                        <th>Users</th>
                        <th>Created</th>
                        <th>Approval Details</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="company : ${companies}">
                        <td th:text="${company.companyName}">Company</td>
                        <td>
                            <span class="badge text-bg-warning" th:if="${company.approvalStatus.name() == 'PENDING'}">PENDING</span>
                            <span class="badge text-bg-success" th:if="${company.approvalStatus.name() == 'APPROVED'}">APPROVED</span>
                            <span class="badge text-bg-danger" th:if="${company.approvalStatus.name() == 'REJECTED'}">REJECTED</span>
                        </td>
                        <td>
                            <span class="badge text-bg-success" th:if="${company.active}">ENABLED</span>
                            <span class="badge text-bg-secondary" th:unless="${company.active}">SUSPENDED</span>
                        </td>
                        <td th:text="${company.usersCount}">0</td>
                        <td th:text="${#temporals.format(company.createdAt, 'dd MMM yyyy')}">-</td>
                        <td>
                            <span th:if="${company.approvedBy != null}">
                                <span th:text="${company.approvedBy}">owner</span>
                                <small class="text-muted d-block" th:text="${#temporals.format(company.approvedAt, 'dd MMM yyyy HH:mm')}">-</small>
                            </span>
                            <span class="text-muted" th:if="${company.approvedBy == null}">Not reviewed</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2 flex-wrap">
                                <form th:if="${company.approvalStatus.name() != 'APPROVED'}" th:action="@{/owner/companies/{id}/approve(id=${company.companyId})}" method="post">
                                    <button type="submit" class="btn btn-success btn-sm">Approve</button>
                                </form>
                                <form th:if="${company.approvalStatus.name() != 'REJECTED'}" th:action="@{/owner/companies/{id}/reject(id=${company.companyId})}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">Reject</button>
                                </form>
                                <form th:if="${company.approvalStatus.name() == 'APPROVED'}" th:action="@{/owner/companies/{id}/toggle-access(id=${company.companyId})}" method="post">
                                    <button type="submit" class="btn btn-outline-primary btn-sm"
                                            th:text="${company.active ? 'Suspend Access' : 'Enable Access'}">Toggle</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            alert.style.transition = "opacity 0.5s ease";
            alert.style.opacity = "0";
            setTimeout(() => alert.style.display = "none", 500);
        });
    }, 20000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
