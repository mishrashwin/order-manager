<!DOCTYPE html>
<html th:with="page='dashboard'" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Order Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="dashboard-page">
<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Flash Notifications Container -->
<div class="flash-notifications-container" id="flashNotificationsContainer"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
  <div class="content-header dashboard-header">
    <h1 class="dashboard-title"><i class="bi bi-speedometer2"></i> Order Dashboard</h1>

    <form method="get" action="/dashboard" class="dashboard-filter">
      <input type="date" class="form-control form-control-sm date-input" id="startDate" name="startDate"
             th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}"
             title="Start Date" required>
      <span class="text-muted dashboard-filter-separator">to</span>
      <input type="date" class="form-control form-control-sm date-input" id="endDate" name="endDate"
             th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}"
             title="End Date" required>
      <div class="dashboard-filter-actions">
        <button type="submit" class="btn btn-sm btn-primary" title="Apply Date Filter">
          <i class="bi bi-funnel"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetDateRange()" title="Reset Date Range">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </div>
    </form>
  </div>

  <!-- Order Board -->
  <div class="board">
    <div class="column" th:attr="id=${status.name()}" th:each="status : ${statuses}">
      <h5 th:text="${status.displayName}"></h5>

      <div class="order-list" th:attr="id='list-' + ${status.name()}">
        <div class="order-card"
             th:attr="data-id=${order.id}"
             th:each="order : ${orders}"
             th:if="${order.status.name() == status.name()}">

          <strong th:text="${order.customerName}"></strong><br>

          <small class="text-muted">
            <span th:text="${order.productName}"></span>
            (<span th:text="${order.quantity}"></span>)
          </small>

          <!-- Dates -->
          <div class="order-dates mt-1">
            <small th:text="'Order: ' + ${#temporals.format(order.orderDate, 'dd MMM yyyy')}"></small>

            <small th:classappend="
                            ${order.status.final}
                                ? 'delivery-date delivered'
                                : (${order.deliveryDate != null and order.deliveryDate.isBefore(T(java.time.LocalDate).now())}
                                    ? 'delivery-date overdue'
                                    : 'delivery-date upcoming')"
                   th:text="'Delivery: ' + (${order.deliveryDate != null ? #temporals.format(order.deliveryDate, 'dd MMM yyyy') : '-'})">
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
  // Reset date range to default (past one month)
  function resetDateRange() {
    const today = new Date();
    const oneMonthAgo = new Date(today);
    oneMonthAgo.setMonth(today.getMonth() - 1);

    const formatDate = (date) => date.toISOString().split('T')[0];

    window.location.href = `/dashboard?startDate=${formatDate(oneMonthAgo)}&endDate=${formatDate(today)}`;
  }

  // Parse YYYY-MM-DD as a local date to avoid UTC timezone shifts.
  function parseLocalIsoDate(value) {
    if (typeof value !== 'string') {
      return null;
    }

    const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) {
      return null;
    }

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const parsed = new Date(year, month - 1, day);

    // Reject rollover dates like 2026-02-31.
    if (parsed.getFullYear() !== year || parsed.getMonth() !== month - 1
        || parsed.getDate() !== day) {
      return null;
    }

    return parsed;
  }

  // Create and render a flash notification for an urgent order
  function createFlashNotification(order) {
    const container = document.getElementById('flashNotificationsContainer');
    const safeOrder = order || {};

    // Create notification element
    const notification = document.createElement('div');
    notification.className = 'flash-notification urgent';
    notification.id = `notification-${String(safeOrder.id ?? 'unknown')}`;

    const customerName = safeOrder.customerName == null ? 'Unknown customer' : String(safeOrder.customerName);
    const productName = safeOrder.productName == null ? 'Unknown product' : String(safeOrder.productName);
    const quantityText = safeOrder.quantity == null ? '-' : String(safeOrder.quantity);

    // Calculate days until delivery
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const deliveryDate = parseLocalIsoDate(safeOrder.deliveryDate);
    let daysText = 'Soon';
    if (deliveryDate !== null) {
      deliveryDate.setHours(0, 0, 0, 0);
      const daysUntilDelivery = Math.ceil((deliveryDate - today) / (1000 * 60 * 60 * 24));
      daysText =
          daysUntilDelivery === 0 ? 'Today' : `In ${daysUntilDelivery} day${daysUntilDelivery !== 1 ? 's' : ''}`;
    }

    const header = document.createElement('div');
    header.className = 'flash-notification-header';

    const title = document.createElement('h6');
    title.className = 'flash-notification-title';
    const titleIcon = document.createElement('i');
    titleIcon.className = 'bi bi-exclamation-circle-fill';
    title.appendChild(titleIcon);
    title.appendChild(document.createTextNode(' Urgent Order Alert'));

    const closeButton = document.createElement('button');
    closeButton.className = 'flash-notification-close';
    closeButton.type = 'button';
    closeButton.title = 'Dismiss';
    closeButton.addEventListener('click', function () {
      notification.remove();
    });
    const closeIcon = document.createElement('i');
    closeIcon.className = 'bi bi-x-lg';
    closeButton.appendChild(closeIcon);

    header.appendChild(title);
    header.appendChild(closeButton);

    const content = document.createElement('p');
    content.className = 'flash-notification-content';
    const customerStrong = document.createElement('strong');
    customerStrong.textContent = customerName;
    content.appendChild(customerStrong);
    content.appendChild(document.createTextNode(` - ${productName} (Qty: ${quantityText})`));

    const meta = document.createElement('div');
    meta.className = 'flash-notification-meta';
    const deliverySpan = document.createElement('span');
    deliverySpan.className = 'flash-notification-delivery';
    const deliveryIcon = document.createElement('i');
    deliveryIcon.className = 'bi bi-calendar-event';
    deliverySpan.appendChild(deliveryIcon);
    deliverySpan.appendChild(document.createTextNode(` Delivery: ${daysText}`));
    meta.appendChild(deliverySpan);

    notification.appendChild(header);
    notification.appendChild(content);
    notification.appendChild(meta);

    // Append to container
    container.appendChild(notification);

    // Auto-dismiss after 20 seconds
    setTimeout(() => {
      notification.remove();
    }, 20000);

    return notification;
  }

  document.addEventListener("DOMContentLoaded", function () {
      // Initialize urgent order notifications from Thymeleaf-inlined data.
      try {
        const urgentOrders = /*[[${urgentOrders}]]*/ [];
        if (window._debug) console.log('Urgent Orders Data:', urgentOrders);

        if (urgentOrders && Array.isArray(urgentOrders) && urgentOrders.length > 0) {
          if (window._debug) console.log('Found ' + urgentOrders.length + ' urgent orders, initializing notifications...');
          // Create a notification for each urgent order with slight delay between each
          urgentOrders.forEach((order, index) => {
            setTimeout(() => {
              createFlashNotification(order);
            }, index * 300); // 300ms stagger between notifications
          });
        } else {
          if (window._debug) console.log('No urgent orders found or urgentOrders is not an array');
        }
      } catch (e) {
        if (window._debug) console.error('Error initializing urgent notifications:', e);
      }

      const lists = document.querySelectorAll(".order-list");
      const sharedGroup = { name: "orders", pull: true, put: true };

      // Prevent text selection during drag
      document.addEventListener('selectstart', function(e) {
          if (e.target.closest('.order-card')) {
              e.preventDefault();
          }
      });

      // Disable text selection during drag via mouse
      document.addEventListener('mousedown', function(e) {
          if (e.target.closest('.order-card') || e.target.closest('.column')) {
              e.preventDefault();
          }
      }, true);

      lists.forEach(listEl => {
          new Sortable(listEl, {
              group: sharedGroup,
              animation: 150,
              forceFallback: true,
              fallbackOnBody: true,
              draggable: ".order-card",
              ghostClass: "bg-light",
              preventOnFilter: false,
              swapThreshold: 0.65,
              onStart: function(evt) {
                  // Disable text selection on start
                  document.body.style.userSelect = 'none';
                  document.body.style.WebkitUserSelect = 'none';
              },
              onEnd: function(evt) {
                  // Re-enable text selection
                  document.body.style.userSelect = 'auto';
                  document.body.style.WebkitUserSelect = 'auto';
              },
              onAdd: function (evt) {
                  const orderId = evt.item.dataset.id;
                  const newStatus = evt.to.id.replace("list-", "");
                  axios.patch(`/api/orders/${orderId}`, { status: newStatus })
                      .then(() => {
                          if (window._debug) console.log(`✅ Order ${orderId} moved to ${newStatus}`);
                      })
                      .catch(err => {
                          if (window._debug) console.error("❌ Failed to update order:", err);
                          evt.from.appendChild(evt.item);
                      });
              }
          });
      });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
