<!DOCTYPE html>
<html th:with="page='dashboard'" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Order Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="dashboard-page">
<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Flash Notifications Container -->
<div class="flash-notifications-container" id="flashNotificationsContainer"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
  <div class="content-header dashboard-header">
    <h1 class="dashboard-title"><i class="bi bi-speedometer2"></i> Order Dashboard</h1>

    <form method="get" action="/dashboard" class="dashboard-filter">
      <div class="dashboard-search-group" role="search" aria-label="Search dashboard orders">
        <i class="bi bi-search"></i>
        <input type="text" class="form-control form-control-sm" id="dashboardSearchInput"
               placeholder="🔍 Search client, PO, product...">
      </div>
      <input type="date" class="form-control form-control-sm date-input" id="startDate" name="startDate"
             th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}"
             title="Start Date" required>
      <span class="text-muted dashboard-filter-separator">to</span>
      <input type="date" class="form-control form-control-sm date-input" id="endDate" name="endDate"
             th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}"
             title="End Date" required>
      <div class="dashboard-filter-actions">
        <button type="submit" class="btn btn-sm btn-primary" title="Apply Date Filter">
          <i class="bi bi-funnel"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetDateRange()" title="Reset Date Range">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </div>
    </form>
  </div>

  <!-- Order Board -->
  <div class="board">
    <div class="column" th:attr="id=${status.name()}" th:each="status : ${statuses}">
      <h5 th:text="${status.displayName}"></h5>

      <div class="order-list" th:attr="id='list-' + ${status.name()}">
        <div class="order-card"
             th:attr="data-id=${order.id},
                      data-customer-name=${order.customerName},
                      data-product-name=${order.productName},
                      data-quantity=${order.quantity},
                      data-po-order-no=${order.poOrderNo != null ? order.poOrderNo : ''},
                      data-status-display=${order.status.displayName},
                      data-badge-color=${order.status.badgeColor},
                      data-order-date=${#temporals.format(order.orderDate, 'dd MMM yyyy')},
                      data-delivery-date=${order.deliveryDate != null ? #temporals.format(order.deliveryDate, 'dd MMM yyyy') : ''},
                      data-total-amount=${order.totalAmount},
                      data-order-note=${order.orderNote != null ? order.orderNote : ''}"
             th:each="order : ${orders}"
             th:if="${order.status.name() == status.name()}">

          <strong th:text="${order.customerName}"></strong><br>

          <small class="text-muted">
            <span th:if="${order.poOrderNo != null and !#strings.isEmpty(order.poOrderNo)}"
                  th:text="${order.poOrderNo + ' / '}"></span><span th:text="${order.productName}"></span>
            (<span th:text="${order.quantity}"></span>)
          </small>

          <!-- Delivery Date -->
          <div class="order-dates mt-1">
            <small th:classappend="
                            ${order.status.final}
                                ? 'delivery-date delivered'
                                : (${order.deliveryDate != null and order.deliveryDate.isBefore(T(java.time.LocalDate).now())}
                                    ? 'delivery-date overdue'
                                    : 'delivery-date upcoming')"
                   th:text="'Delivery: ' + (${order.deliveryDate != null ? #temporals.format(order.deliveryDate, 'dd MMM yyyy') : '-'})">
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal (read-only, opened by double-clicking a card) -->
<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderDetailModalLabel"><i class="bi bi-receipt"></i> Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <dl class="row mb-0">
          <dt class="col-5">Client</dt>
          <dd class="col-7" id="modalCustomerName">-</dd>
          <dt class="col-5">PO / Order No</dt>
          <dd class="col-7" id="modalPoOrderNo">-</dd>
          <dt class="col-5">Product</dt>
          <dd class="col-7" id="modalProductName">-</dd>
          <dt class="col-5">Quantity</dt>
          <dd class="col-7" id="modalQuantity">-</dd>
          <dt class="col-5">Total Amount</dt>
          <dd class="col-7" id="modalTotalAmount">-</dd>
          <dt class="col-5">Status</dt>
          <dd class="col-7"><span id="modalStatus" class="badge">-</span></dd>
          <dt class="col-5">Order Date</dt>
          <dd class="col-7" id="modalOrderDate">-</dd>
          <dt class="col-5">Delivery Date</dt>
          <dd class="col-7" id="modalDeliveryDate">-</dd>
          <dt class="col-5 border-top pt-2">Notes</dt>
          <dd class="col-7 border-top pt-2" id="modalOrderNote">-</dd>
        </dl>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
  // Reset date range to default (past one month)
  function resetDateRange() {
    const today = new Date();
    const oneMonthAgo = new Date(today);
    oneMonthAgo.setMonth(today.getMonth() - 1);

    const formatDate = (date) => date.toISOString().split('T')[0];

    window.location.href = `/dashboard?startDate=${formatDate(oneMonthAgo)}&endDate=${formatDate(today)}`;
  }

  // Parse YYYY-MM-DD as a local date to avoid UTC timezone shifts.
  function parseLocalIsoDate(value) {
    if (typeof value !== 'string') {
      return null;
    }

    const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) {
      return null;
    }

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const parsed = new Date(year, month - 1, day);

    // Reject rollover dates like 2026-02-31.
    if (parsed.getFullYear() !== year || parsed.getMonth() !== month - 1
        || parsed.getDate() !== day) {
      return null;
    }

    return parsed;
  }

  // Create and render a flash notification for an urgent order
  function createFlashNotification(order) {
    const container = document.getElementById('flashNotificationsContainer');
    const safeOrder = order || {};

    // Create notification element
    const notification = document.createElement('div');
    notification.className = 'flash-notification urgent';
    notification.id = `notification-${String(safeOrder.id ?? 'unknown')}`;

    const customerName = safeOrder.customerName == null ? 'Unknown customer' : String(safeOrder.customerName);
    const productName = safeOrder.productName == null ? 'Unknown product' : String(safeOrder.productName);
    const quantityText = safeOrder.quantity == null ? '-' : String(safeOrder.quantity);

    // Calculate days until delivery
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const deliveryDate = parseLocalIsoDate(safeOrder.deliveryDate);
    let daysText = 'Soon';
    if (deliveryDate !== null) {
      deliveryDate.setHours(0, 0, 0, 0);
      const daysUntilDelivery = Math.ceil((deliveryDate - today) / (1000 * 60 * 60 * 24));
      if (daysUntilDelivery < 0) {
        const overdueDays = Math.abs(daysUntilDelivery);
        daysText = `${overdueDays} day${overdueDays !== 1 ? 's' : ''} overdue`;
      } else {
        daysText =
            daysUntilDelivery === 0 ? 'Today' : `In ${daysUntilDelivery} day${daysUntilDelivery !== 1 ? 's' : ''}`;
      }
    }

    const header = document.createElement('div');
    header.className = 'flash-notification-header';

    const title = document.createElement('h6');
    title.className = 'flash-notification-title';
    const titleIcon = document.createElement('i');
    titleIcon.className = 'bi bi-exclamation-circle-fill';
    title.appendChild(titleIcon);
    title.appendChild(document.createTextNode(' Urgent Order Alert'));

    const closeButton = document.createElement('button');
    closeButton.className = 'flash-notification-close';
    closeButton.type = 'button';
    closeButton.title = 'Dismiss';
    closeButton.addEventListener('click', function () {
      notification.remove();
    });
    const closeIcon = document.createElement('i');
    closeIcon.className = 'bi bi-x-lg';
    closeButton.appendChild(closeIcon);

    header.appendChild(title);
    header.appendChild(closeButton);

    const content = document.createElement('p');
    content.className = 'flash-notification-content';
    const customerStrong = document.createElement('strong');
    customerStrong.textContent = customerName;
    content.appendChild(customerStrong);
    content.appendChild(document.createTextNode(` - ${productName} (Qty: ${quantityText})`));

    const meta = document.createElement('div');
    meta.className = 'flash-notification-meta';
    const deliverySpan = document.createElement('span');
    deliverySpan.className = 'flash-notification-delivery';
    const deliveryIcon = document.createElement('i');
    deliveryIcon.className = 'bi bi-calendar-event';
    deliverySpan.appendChild(deliveryIcon);
    deliverySpan.appendChild(document.createTextNode(` Delivery: ${daysText}`));
    meta.appendChild(deliverySpan);

    notification.appendChild(header);
    notification.appendChild(content);
    notification.appendChild(meta);

    // Append to container
    container.appendChild(notification);

    // Auto-dismiss after 20 seconds
    setTimeout(() => {
      notification.remove();
    }, 20000);

    return notification;
  }

  document.addEventListener("DOMContentLoaded", function () {
      const searchInput = document.getElementById('dashboardSearchInput');

      // Precompute a normalized searchable string for each card once on load.
      const orderCards = document.querySelectorAll('.order-card');
      orderCards.forEach(function (card) {
          const d = card.dataset;
          card.dataset.searchText = [d.customerName, d.poOrderNo, d.productName, d.quantity]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
      });

      function debounce(fn, delay) {
          let timeoutId;
          return function () {
              const ctx = this, args = arguments;
              clearTimeout(timeoutId);
              timeoutId = setTimeout(function () { fn.apply(ctx, args); }, delay);
          };
      }

      const applyDashboardCardFilter = function () {
          const query = (searchInput ? searchInput.value : '').trim().toLowerCase();
          orderCards.forEach(function (card) {
              card.style.display =
                  query === '' || (card.dataset.searchText || '').includes(query) ? '' : 'none';
          });
      };

      if (searchInput) {
          searchInput.addEventListener('input', debounce(applyDashboardCardFilter, 150));
          applyDashboardCardFilter();
      }

      // Initialize urgent order notifications from Thymeleaf-inlined data.
      try {
        const urgentOrders = /*[[${urgentOrders}]]*/ [];
        if (window._debug) console.log('Urgent Orders Data:', urgentOrders);

        if (urgentOrders && Array.isArray(urgentOrders) && urgentOrders.length > 0) {
          if (window._debug) console.log('Found ' + urgentOrders.length + ' urgent orders, initializing notifications...');
          // Create a notification for each urgent order with slight delay between each
          urgentOrders.forEach((order, index) => {
            setTimeout(() => {
              createFlashNotification(order);
            }, index * 300); // 300ms stagger between notifications
          });
        } else {
          if (window._debug) console.log('No urgent orders found or urgentOrders is not an array');
        }
      } catch (e) {
        if (window._debug) console.error('Error initializing urgent notifications:', e);
      }

      const lists = document.querySelectorAll(".order-list");
      const sharedGroup = { name: "orders", pull: true, put: true };

      // Prevent text selection during drag
      document.addEventListener('selectstart', function(e) {
          if (e.target.closest('.order-card')) {
              e.preventDefault();
          }
      });

      // Disable text selection during drag via mouse
      document.addEventListener('mousedown', function(e) {
          if (e.target.closest('.order-card') || e.target.closest('.column')) {
              e.preventDefault();
          }
      }, true);

      lists.forEach(listEl => {
          new Sortable(listEl, {
              group: sharedGroup,
              animation: 150,
              forceFallback: true,
              fallbackOnBody: true,
              draggable: ".order-card",
              ghostClass: "bg-light",
              preventOnFilter: false,
              swapThreshold: 0.65,
              onStart: function(evt) {
                  // Disable text selection on start
                  document.body.style.userSelect = 'none';
                  document.body.style.WebkitUserSelect = 'none';
              },
              onEnd: function(evt) {
                  // Re-enable text selection
                  document.body.style.userSelect = 'auto';
                  document.body.style.WebkitUserSelect = 'auto';
              },
              onAdd: function (evt) {
                  const orderId = evt.item.dataset.id;
                  const newStatus = evt.to.id.replace("list-", "");
                  axios.patch(`/api/orders/${orderId}`, { status: newStatus })
                      .then(() => {
                          if (window._debug) console.log(`✅ Order ${orderId} moved to ${newStatus}`);
                      })
                      .catch(err => {
                          if (window._debug) console.error("❌ Failed to update order:", err);
                          evt.from.appendChild(evt.item);
                      });
              }
          });
      });

      // Double-click on an order card to view full read-only details
      document.querySelector('.board').addEventListener('dblclick', function (e) {
          const card = e.target.closest('.order-card');
          if (!card) return;

          const d = card.dataset;

          document.getElementById('modalCustomerName').textContent = d.customerName || '-';
          document.getElementById('modalPoOrderNo').textContent = d.poOrderNo || '-';
          document.getElementById('modalProductName').textContent = d.productName || '-';
          document.getElementById('modalQuantity').textContent = d.quantity || '-';

          const amount = parseFloat(d.totalAmount);
          document.getElementById('modalTotalAmount').textContent =
              isNaN(amount) ? '-' : '₹' + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

          const statusEl = document.getElementById('modalStatus');
          statusEl.textContent = d.statusDisplay || '-';
          statusEl.className = 'badge badge-custom bg-' + (d.badgeColor || 'secondary');

          document.getElementById('modalOrderDate').textContent = d.orderDate || '-';
          document.getElementById('modalDeliveryDate').textContent = d.deliveryDate || '-';
          document.getElementById('modalOrderNote').textContent = d.orderNote || '-';

          new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
      });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
