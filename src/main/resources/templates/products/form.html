<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='products'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-box-seam"></i>
            <span th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="${returnTo != null ? returnTo : '/products'}">
            <i class="bi bi-arrow-left"></i> Back to Products
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

        <form id="productForm" th:action="@{/products(returnTo=${returnTo})}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-box"></i> Product Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-custom" th:field="*{name}" required
                           placeholder="e.g., Steel Rod 12mm">
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-tag"></i> Other / Similar Name</label>
                    <input type="text" class="form-control form-control-custom" th:field="*{similarName}"
                           placeholder="e.g., Iron Rod, MS Rod">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-card-text"></i> Description</label>
                <textarea class="form-control form-control-custom" th:field="*{description}"
                          rows="3" placeholder="Product description..."></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-building"></i> Brand <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-custom" th:field="*{brand}"
                           placeholder="e.g., Tata, SAIL" required>
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label"><i class="bi bi-grid"></i> Category <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-custom" th:field="*{category}"
                           placeholder="e.g., Raw Material, Finished Goods" required>
                </div>
                <div class="col-md-3 mb-4">
                    <label class="form-label"><i class="bi bi-currency-rupee"></i> Price</label>
                    <input type="number" class="form-control form-control-custom" th:field="*{price}"
                           step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="col-md-3 mb-4">
                    <label class="form-label"><i class="bi bi-123"></i> HSN Code</label>
                    <input type="text" class="form-control form-control-custom" th:field="*{hsnCode}" placeholder="HSN Code">
                </div>
                <div class="col-md-3 mb-4">
                    <label class="form-label"><i class="bi bi-boxes"></i> Unit</label>
                    <input type="text" class="form-control form-control-custom" th:field="*{unit}" placeholder="Unit (e.g., PCS)">
                </div>
                <div class="col-md-3 mb-4">
                    <label class="form-label"><i class="bi bi-percent"></i> GST %</label>
                    <input type="number" class="form-control form-control-custom" th:field="*{gstPercentage}"
                           step="0.01" min="0" max="100" placeholder="e.g., 18">
                    <small class="form-text text-muted">GST percentage for tax calculation (optional)</small>
                </div>
            </div>

            <!-- Vendor Dropdown -->
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-building-check"></i> Vendor <span class="text-danger">*</span></label>
                <div class="input-group">
                    <select class="form-select form-control-custom" th:field="*{vendor.id}" required>
                        <option value="">-- Select Vendor --</option>
                        <option th:each="vendor : ${vendors}"
                                th:value="${vendor.id}"
                                th:text="${vendor.companyName}"
                                th:selected="${product.vendor != null and product.vendor.id == vendor.id}">
                        </option>
                    </select>
                    <a id="addVendorLink" class="btn btn-outline-success" th:href="@{/vendors/new}">
                        <i class="bi bi-plus-circle"></i> Add Vendor
                    </a>
                </div>
                <small class="form-text text-muted">If the desired vendor is missing, click "Add Vendor".</small>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="${returnTo != null ? returnTo : '/products'}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button id="productSubmitBtn" type="submit" class="btn btn-success-custom" disabled>
                    <i class="bi bi-check-circle"></i> <span th:text="${product.id == null ? 'Save Product' : 'Update Product'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const productDraftStorageKey = 'om:draft:product:' + window.location.pathname + window.location.search;
    const productDraftTtlMs = 8 * 60 * 60 * 1000;

    function saveProductDraft() {
        const form = document.getElementById('productForm');
        if (!form) {
            return;
        }

        const values = {};
        form.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (field) {
            if (field.name === 'returnTo') {
                return;
            }
            values[field.name] = field.value;
        });

        const draft = {
            updatedAt: Date.now(),
            values: values
        };

        sessionStorage.setItem(productDraftStorageKey, JSON.stringify(draft));
    }

    function restoreProductDraft() {
        const rawDraft = sessionStorage.getItem(productDraftStorageKey);
        if (!rawDraft) {
            return;
        }

        try {
            const draft = JSON.parse(rawDraft);
            if (!draft.updatedAt || (Date.now() - draft.updatedAt) > productDraftTtlMs) {
                sessionStorage.removeItem(productDraftStorageKey);
                return;
            }

            if (!draft.values) {
                return;
            }

            Object.keys(draft.values).forEach(function (name) {
                const field = document.querySelector('#productForm [name="' + name + '"]');
                if (field) {
                    field.value = draft.values[name];
                }
            });
        } catch (error) {
            sessionStorage.removeItem(productDraftStorageKey);
        }
    }

    function areMandatoryProductFieldsFilled() {
        const productName = document.getElementById('name');
        const brand = document.getElementById('brand');
        const category = document.getElementById('category');
        const vendor = document.querySelector('#productForm select[name="vendor.id"]');

        return !!(productName && productName.value.trim()
            && brand && brand.value.trim()
            && category && category.value.trim()
            && vendor && vendor.value);
    }

    function updateProductSubmitState() {
        const submitButton = document.getElementById('productSubmitBtn');
        if (!submitButton) {
            return;
        }
        submitButton.disabled = !areMandatoryProductFieldsFilled();
    }

    document.addEventListener('DOMContentLoaded', function () {
        restoreProductDraft();
        updateProductSubmitState();

        const productForm = document.getElementById('productForm');
        if (productForm) {
            productForm.addEventListener('input', function () {
                saveProductDraft();
                updateProductSubmitState();
            });
            productForm.addEventListener('change', function () {
                saveProductDraft();
                updateProductSubmitState();
            });
        }

        const addVendorLink = document.getElementById('addVendorLink');
        if (addVendorLink) {
            addVendorLink.addEventListener('click', function (e) {
                e.preventDefault();
                saveProductDraft();
                const productReturnTo = window.location.pathname + window.location.search;
                window.location.href = '/vendors/new?returnTo=' + encodeURIComponent(productReturnTo);
            });
        }

        document.querySelectorAll('a[href="/products"]').forEach(function (link) {
            link.addEventListener('click', function () {
                sessionStorage.removeItem(productDraftStorageKey);
            });
        });
    });
</script>
</body>
</html>
