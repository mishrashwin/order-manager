<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-dashboard'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: "Poppins", sans-serif;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #3498db;
            text-align: center;
        }

        .stat-card i {
            font-size: 2.5rem;
            color: #3498db;
            margin-bottom: 0.5rem;
        }

        .stat-card h5 {
            color: #7f8c8d;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .admin-section {
            margin-top: 2rem;
        }

        .admin-section h4 {
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e0e0e0;
            color: #2c3e50;
        }

        .unified-card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .btn-primary-custom {
            background-color: #3498db;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-primary-custom:hover {
            background-color: #2980b9;
            text-decoration: none;
        }

        .btn-outline-secondary {
            color: #34495e;
            border-color: #34495e;
        }

        .btn-outline-secondary:hover {
            background-color: #34495e;
            color: white;
        }
    </style>
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-shield-check"></i> Admin Dashboard</h1>
        <a class="btn btn-primary-custom" th:href="@{/admin/users}">
            <i class="bi bi-people"></i> Manage Users
        </a>
    </div>

    <!-- Admin Stats -->
    <div class="admin-stats">
        <div class="stat-card">
            <i class="bi bi-box-seam"></i>
            <h5>Total Orders</h5>
            <div class="stat-value" th:text="${totalOrders}">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #27ae60;">
            <i class="bi bi-people" style="color: #27ae60;"></i>
            <h5>Total Clients</h5>
            <div class="stat-value" th:text="${totalClients}">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #e74c3c;">
            <i class="bi bi-building" style="color: #e74c3c;"></i>
            <h5>Total Vendors</h5>
            <div class="stat-value" th:text="${totalVendors}">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #f39c12;">
            <i class="bi bi-person-check" style="color: #f39c12;"></i>
            <h5>Total Users</h5>
            <div class="stat-value" th:text="${totalUsers}">0</div>
        </div>
    </div>

    <!-- Admin Sections -->
    <div class="admin-section">
        <h4><i class="bi bi-gear"></i> Administration</h4>
        <div class="unified-card">
            <p>Welcome to the Admin Panel. From here you can manage users, view system statistics, and control access permissions.</p>
            <div class="d-flex gap-2">
                <a class="btn btn-primary-custom" th:href="@{/admin/users}">
                    <i class="bi bi-people"></i> Manage Users
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
