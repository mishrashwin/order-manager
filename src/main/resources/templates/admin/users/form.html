<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-add-user'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-person-plus"></i> Add New User</h1>
        <a class="btn btn-secondary" th:href="@{/admin/users}">
            <i class="bi bi-arrow-left"></i> Back to Users
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <form th:action="@{/admin/users/add}" th:object="${user}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person"></i> First Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{firstName}" required>
                <div class="form-text">User's first name</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person"></i> Last Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{lastName}" required>
                <div class="form-text">User's last name</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person-badge"></i> Username</label>
                <input type="text" class="form-control form-control-custom" th:field="*{username}" required>
                <div class="form-text">Unique username for login</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" class="form-control form-control-custom" th:field="*{email}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-phone"></i> Mobile Number</label>
                <input type="tel" class="form-control form-control-custom" th:field="*{mobileNumber}" required>
                <div class="form-text">10-15 digits</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-lock"></i> Password</label>
                <input type="password" class="form-control form-control-custom" th:field="*{password}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-shield-check"></i> Role</label>
                <select class="form-select form-control-custom" th:field="*{role}" required>
                    <option value="">-- Select Role --</option>
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <div class="col-12 pt-3 border-top">
                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-success-custom">
                        <i class="bi bi-check-circle"></i> Create User
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
