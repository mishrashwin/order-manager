<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-users'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-people"></i> Manage Users</h1>
        <a class="btn btn-success-custom" th:href="@{/admin/users/add}">
            <i class="bi bi-plus-circle"></i> Add New User
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search & Filters -->
    <div class="search-box om-list-toolbar">
        <div class="om-list-toolbar-row">
            <input type="text" id="searchInput" class="form-control-custom om-list-search-input"
                   placeholder="🔍 Search users by username, email, company...">
            <div class="om-list-actions">
                <button id="resetSortBtn" class="btn btn-outline-secondary om-btn-icon">
                <i class="bi bi-arrow-clockwise"></i> Reset Sort
                </button>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <i class="bi bi-people"></i>
        <h4>No users found</h4>
        <p>Get started by adding your first user</p>
        <a th:href="@{/admin/users/add}" class="btn btn-success-custom">
            <i class="bi bi-plus-circle"></i> Add First User
        </a>
    </div>

    <!-- Users Table -->
    <div th:if="${!#lists.isEmpty(users)}" class="unified-card">
        <div class="table-responsive">
            <table class="table unified-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="om-sortable">#</th>
                    <th class="om-sortable">First Name</th>
                    <th class="om-sortable">Last Name</th>
                    <th class="om-sortable">Username</th>
                    <th class="om-sortable">Email</th>
                    <th class="om-sortable">Role</th>
                    <th class="om-sortable">Status</th>
                    <th class="text-center no-sort">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user, iterStat : ${users}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td><strong th:text="${user.username}"></strong></td>
                    <td><i class="bi bi-envelope"></i> <span th:text="${user.email}"></span></td>
                    <td>
                        <span th:class="'badge om-status-pill ' + ${user.role == 'ADMIN' ? 'om-status-pill--admin' : 'om-status-pill--user'}"
                              th:text="${user.role}"></span>
                    </td>
                    <td>
                        <span th:class="'badge om-status-pill ' + ${user.enabled ? 'om-status-pill--verified' : 'om-status-pill--pending'}"
                              th:text="${user.enabled ? 'Verified' : 'Pending'}"></span>
                    </td>
                    <td class="text-center">
                        <div class="action-buttons om-action-group">
                            <a th:href="@{|/admin/users/${user.id}/edit|}"
                               class="btn btn-sm btn-outline-primary om-btn-icon"
                               title="Edit user">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <form th:action="@{|/admin/users/${user.id}/toggle-status|}" method="post" class="om-inline-form">
                                <button type="submit"
                                        th:class="'btn btn-sm om-btn-icon ' + (${user.accountActive} ? 'btn-success' : 'btn-outline-secondary')"
                                        th:disabled="${user.username == currentUsername}"
                                        th:title="${user.accountActive ? 'Click to deactivate this user' : 'Click to activate this user'}"
                                        th:data-username="${user.username}"
                                        onclick="return confirm('Change status of user ' + this.dataset.username + '?');">
                                    <i th:class="'bi ' + (${user.accountActive} ? 'bi-toggle-on' : 'bi-toggle-off')"></i>
                                    <span th:text="${user.accountActive ? 'Active' : 'Inactive'}"></span>
                                </button>
                            </form>
                            <form th:action="@{|/admin/users/${user.id}/delete|}" method="post" class="om-inline-form">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger om-btn-icon"
                                        th:disabled="${user.username == currentUsername && user.role == 'ADMIN' && adminCount <= 1}"
                                        title="Delete user"
                                        onclick="return confirm('Are you sure you want to delete this user?');">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="unified-card-body">
            <p class="text-muted-custom mb-0">
                <i class="bi bi-info-circle"></i> Total Users: <strong th:text="${users.size()}"></strong>
            </p>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Table Utility JS -->
<div th:replace="~{fragments/table-utils :: tableUtils}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
