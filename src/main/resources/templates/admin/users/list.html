<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-users'">
<head>
    <meta charset="UTF-8">
    <title>Manage Users | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: "Poppins", sans-serif;
        }

        .navbar {
            background-color: #2c3e50;
            padding: 1rem 2rem;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            color: #bdc3c7 !important;
            margin: 0 0.5rem;
        }

        .navbar-nav .nav-link:hover {
            color: white !important;
        }

        .container-main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .card-header {
            background-color: #3498db;
            color: white;
            border-radius: 8px 8px 0 0;
            padding: 1.5rem;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .btn-add-user {
            background-color: #27ae60;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1.5rem;
            transition: 0.3s;
        }

        .btn-add-user:hover {
            background-color: #229954;
            text-decoration: none;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #ecf0f1;
            border-bottom: 2px solid #bdc3c7;
            font-weight: 600;
            color: #2c3e50;
        }

        .table tbody tr {
            border-bottom: 1px solid #ecf0f1;
        }

        .table tbody tr:hover {
            background-color: #f9f9f9;
        }

        .badge-verified {
            background-color: #27ae60;
        }

        .badge-pending {
            background-color: #e67e22;
        }

        .role-badge {
            background-color: #3498db;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm-custom {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-edit {
            background-color: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background-color: #2980b9;
            color: white;
            text-decoration: none;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .btn-resend {
            background-color: #f39c12;
            color: white;
        }

        .btn-resend:hover {
            background-color: #d68910;
            text-decoration: none;
        }

        .btn-sm-custom:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-sm-custom.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>

<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="bi bi-shield-check"></i> Order Manager Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/users">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">
                        <i class="bi bi-house"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-main">
    <!-- Alerts -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Users Card -->
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-people-fill"></i> Manage Users</h2>
        </div>

        <div class="card-body">
            <!-- Admin Info Section -->
            <div class="alert alert-info" style="margin-bottom: 1.5rem;">
                <i class="bi bi-info-circle"></i>
                <strong>Admin Count:</strong> <span th:text="${adminCount}"></span>/2
                <span th:if="${adminCount >= 2}" style="color: #856404; margin-left: 1rem;">
                    ⚠️ Maximum admins reached
                </span>
            </div>

            <a href="/admin/users/add" class="btn-add-user">
                <i class="bi bi-person-plus"></i> Add New User
            </a>

            <!-- Users Table -->
            <div th:if="${users.size() > 0}">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <strong th:text="${user.username}"></strong>
                                    <span th:if="${user.username == currentUsername}"
                                          class="badge bg-info ms-2" style="font-size: 0.7rem;">
                                        <i class="bi bi-person-check"></i> You
                                    </span>
                                </td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                                <td>
                                    <span class="badge role-badge" th:text="${user.role}"></span>
                                </td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge badge-verified">
                                        <i class="bi bi-check-circle"></i> Verified
                                    </span>
                                    <span th:if="!${user.enabled}" class="badge badge-pending">
                                        <i class="bi bi-clock"></i> Pending
                                    </span>
                                </td>
                                <td>
                                    <div class="action-buttons">
                                        <!-- Edit Button -->
                                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                           class="btn-sm-custom btn-edit"
                                           title="Edit user">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>

                                        <!-- Delete Button with conditional logic -->
                                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                              method="POST" style="display: inline;">
                                            <button type="submit"
                                                    class="btn-sm-custom btn-delete"
                                                    th:disabled="${user.username == currentUsername and user.role == 'ADMIN' and adminCount le 1}"
                                                    th:title="${(user.username == currentUsername and user.role == 'ADMIN' and adminCount le 1) ? 'Cannot delete as you are the only admin' : 'Delete user'}"
                                                    th:attrappend="onclick=${(user.username == currentUsername and user.role == 'ADMIN' and adminCount le 1) ? '' : 'return confirm(&quot;Delete this user?&quot;);'}">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </form>

                                        <!-- Resend Verification -->
                                        <th:block th:if="!${user.enabled}">
                                            <form th:action="@{/admin/users/{id}/resend-verification(id=${user.id})}"
                                                  method="POST" style="display: inline;">
                                                <button type="submit" class="btn-sm-custom btn-resend">
                                                    <i class="bi bi-envelope"></i> Resend
                                                </button>
                                            </form>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p style="margin-top: 1rem; color: #7f8c8d; font-size: 0.9rem;">
                    Total Users: <strong th:text="${users.size()}"></strong>
                </p>
            </div>

            <!-- Empty State -->
            <div th:if="${users.isEmpty()}" class="empty-state">
                <i class="bi bi-inbox"></i>
                <h4>No users yet</h4>
                <p>Get started by adding your first user</p>
                <a href="/admin/users/add" class="btn-add-user">
                    <i class="bi bi-person-plus"></i> Add First User
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
