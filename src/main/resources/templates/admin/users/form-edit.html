<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-edit-user'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-person-check"></i> Edit User</h1>
        <a class="btn btn-secondary" th:href="@{/admin/users}">
            <i class="bi bi-arrow-left"></i> Back to Users
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <form th:action="@{|/admin/users/${user.id}/update|}" th:object="${user}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person"></i> First Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{firstName}" required>
                <div class="form-text">User's first name</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person"></i> Last Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{lastName}" required>
                <div class="form-text">User's last name</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person-badge"></i> Username</label>
                <input type="text" class="form-control form-control-custom" th:field="*{username}" required>
                <div class="form-text">Unique username for login</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" class="form-control form-control-custom" th:field="*{email}" required>
                <div class="form-text">Changing email will trigger a new verification email</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-phone"></i> Mobile Number</label>
                <div class="input-group">
                    <select id="mobileCountryCode" class="form-select" style="max-width:175px;"></select>
                    <input type="tel" id="mobileLocalNumber" class="form-control"
                           placeholder="Phone number" autocomplete="off">
                    <input type="hidden" th:field="*{mobileNumber}" id="mobileNumber">
                </div>
                <div class="form-text">Select country code and enter local phone number</div>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-shield-check"></i> Role</label>
                <select class="form-select form-control-custom" th:field="*{role}" required>
                    <option value="">-- Select Role --</option>
                    <option value="USER" th:selected="${user.role == 'USER'}">User</option>
                    <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-check-circle"></i> Status</label>
                <input type="text" class="form-control form-control-custom"
                       th:value="${user.enabled ? 'Verified' : 'Pending'}" disabled readonly>
                <div class="form-text">Status is automatically managed based on email verification</div>
            </div>

            <div class="col-12 pt-3 border-top">
                <div class="d-flex justify-content-end gap-3">
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-success-custom">
                        <i class="bi bi-check-circle"></i> Update User
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/phone-input.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initPhoneInput('mobileNumber', 'mobileCountryCode', 'mobileLocalNumber');
    });
</script>
</body>
</html>
