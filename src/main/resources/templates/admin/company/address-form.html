<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='admin-company-address-form'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${addressId == null ? 'Add Company Address' : 'Edit Company Address'}">Company Address</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>
<div class="main-content">
    <div class="content-header">
        <h1 th:text="${addressId == null ? 'Add Company Address' : 'Edit Company Address'}">Company Address</h1>
        <a class="btn btn-secondary" th:href="@{/admin/company/addresses}"><i class="bi bi-arrow-left"></i> Back to Addresses</a>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <div class="unified-card">
        <form method="post" th:object="${addressForm}"
              th:action="${addressId == null ? '/admin/company/addresses' : '/admin/company/addresses/' + addressId}"
              class="row g-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-6">
                <label class="form-label" for="nickname">Address Nickname</label>
                <input id="nickname" class="form-control form-control-custom" th:field="*{nickname}"
                       th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'" required maxlength="120">
                <div class="invalid-feedback" th:errors="*{nickname}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="gstin">Address GSTIN</label>
                <input id="gstin" class="form-control form-control-custom" th:field="*{gstin}" maxlength="50">
                <div class="form-text">May be the same as another address GSTIN. Company GSTIN remains available separately.</div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="drugLicenseNumber">Drug License Number (optional)</label>
                <input id="drugLicenseNumber" class="form-control form-control-custom"
                       th:field="*{drugLicenseNumber}" maxlength="100">
                <div class="text-danger" th:errors="*{drugLicenseNumber}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="contactPersonName">Contact Person Name (optional)</label>
                <input id="contactPersonName" class="form-control form-control-custom"
                       th:field="*{contactPersonName}" maxlength="120" placeholder="Name of contact person">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="contactNumber">Contact Number (optional)</label>
                <input id="contactNumber" class="form-control form-control-custom"
                       th:field="*{contactNumber}" maxlength="20" placeholder="Phone number">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="contactEmail">Contact Email (optional)</label>
                <input id="contactEmail" class="form-control form-control-custom"
                       th:field="*{contactEmail}" maxlength="255" placeholder="Email for PO CC">
                <div class="form-text">Receives PO email copy when this address is selected as Bill To or Ship To</div>
            </div>
            <div class="col-12">
                <label class="form-label" for="addressLine1">Address Line 1</label>
                <textarea id="addressLine1" class="form-control form-control-custom" th:field="*{addressLine1}"
                          th:classappend="${#fields.hasErrors('addressLine1')} ? 'is-invalid'" rows="2" required maxlength="1000"></textarea>
                <div class="invalid-feedback" th:errors="*{addressLine1}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="addressLine2">Address Line 2 (optional)</label>
                <textarea id="addressLine2" class="form-control form-control-custom" th:field="*{addressLine2}" rows="2" maxlength="1000"></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="city">City</label>
                <input id="city" class="form-control form-control-custom" th:field="*{city}"
                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" required maxlength="120">
                <div class="invalid-feedback" th:errors="*{city}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="state">State</label>
                <select id="state" class="form-select form-control-custom" th:field="*{state}"
                        th:classappend="${#fields.hasErrors('state')} ? 'is-invalid'" required>
                    <option value="">Select State</option>
                    <option th:each="stateOption : ${states}" th:value="${stateOption}"
                            th:text="${stateOption.displayName + ' (' + stateOption.code + ')'}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{state}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="postalCode">PIN / Postal Code</label>
                <input id="postalCode" class="form-control form-control-custom" th:field="*{postalCode}"
                       th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid'" required maxlength="20">
                <div class="invalid-feedback" th:errors="*{postalCode}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="country">Country</label>
                <input id="country" class="form-control form-control-custom" th:field="*{country}"
                       th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'" required maxlength="100">
                <div class="invalid-feedback" th:errors="*{country}"></div>
            </div>
            <div class="col-12 d-flex justify-content-end gap-2 border-top pt-3">
                <a class="btn btn-outline-secondary" th:href="@{/admin/company/addresses}">Cancel</a>
                <button type="submit" class="btn btn-success" th:text="${addressId == null ? 'Add Address' : 'Save Changes'}">Save</button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
