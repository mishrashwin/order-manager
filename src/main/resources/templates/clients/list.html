<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='clients'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1><i class="bi bi-people"></i> Client Management</h1>
        <a class="btn btn-success-custom" th:href="@{/clients/new}">
            <i class="bi bi-plus-circle"></i> Add New Client
        </a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search & Filters -->
    <div class="search-box om-list-toolbar">
        <div class="om-list-toolbar-row">
            <form method="get" action="/clients" class="d-flex gap-2 flex-grow-1">
                <input type="text" name="search" class="form-control-custom om-list-search-input"
                       placeholder="🔍 Search clients by name, contact, email, phone..."
                       th:value="${search}">
                <button type="submit" class="btn btn-primary om-btn-icon" title="Search">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/clients}" class="btn btn-outline-secondary om-btn-icon" title="Clear Search">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
            <div class="om-list-actions">
                <button id="resetSortBtn" class="btn btn-outline-secondary om-btn-icon">
                <i class="bi bi-arrow-clockwise"></i> Reset Sort
                </button>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(clients)}" class="empty-state">
        <i class="bi bi-people"></i>
        <h4>No clients found</h4>
        <p>Get started by adding your first client</p>
        <a th:href="@{/clients/new}" class="btn btn-success-custom">
            <i class="bi bi-plus-circle"></i> Add First Client
        </a>
    </div>

    <!-- Clients Table -->
    <div th:if="${!#lists.isEmpty(clients)}" class="unified-card">
        <div class="table-responsive">
            <table id="clientTable" class="table unified-table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="om-sortable">#</th>
                    <th class="om-sortable">Company Name</th>
                    <th class="om-sortable">Contact Person</th>
                    <th class="om-sortable">Email</th>
                    <th class="om-sortable">Phone</th>
                    <th class="om-sortable">Address</th>
                    <th class="text-center no-sort">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client, iterStat : ${clients}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td><strong th:text="${client.name}"></strong></td>
                    <td th:text="${client.contactPerson}"></td>
                    <td><i class="bi bi-envelope"></i> <span th:text="${client.email}"></span></td>
                    <td><i class="bi bi-telephone"></i> <span th:text="${client.phone != null ? '+' + client.phone : ''}"></span></td>
                    <td th:text="${#strings.abbreviate(client.address, 30)}"></td>
                    <td class="text-center">
                        <div class="action-buttons om-action-group">
                            <a th:href="@{|/clients/edit/${client.id}|}"
                               class="btn btn-sm btn-outline-primary om-btn-icon"
                               title="Edit client">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'')')}"
                                    type="button"
                                    class="btn btn-sm btn-outline-danger om-btn-icon"
                                    data-bs-toggle="modal"
                                    data-bs-target="#confirmDeleteModal"
                                    th:data-delete-url="@{|/clients/delete/${client.id}|}"
                                    th:data-entity-label="${client.name}"
                                    title="Delete client">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="unified-card-body d-flex justify-content-between align-items-center">
            <p class="text-muted-custom mb-0">
                <i class="bi bi-info-circle"></i> Total Clients: <strong th:text="${totalElements}"></strong>
            </p>
            <nav th:if="${totalPages > 1}" aria-label="Client pagination">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled' : ''">
                        <a class="page-link"
                           th:href="${currentPage <= 1} ? '#' : @{/clients(search=${search}, page=${currentPage - 2})}">
                            <i class="bi bi-chevron-left"></i> Prev
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${i == currentPage} ? 'active' : ''">
                        <a class="page-link"
                           th:href="@{/clients(search=${search}, page=${i - 1})}"
                           th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled' : ''">
                        <a class="page-link"
                           th:href="${currentPage >= totalPages} ? '#' : @{/clients(search=${search}, page=${currentPage})}">
                            Next <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Table Utility JS -->
<div th:replace="~{fragments/table-utils :: tableUtils}"></div>

<!-- Password Confirmation Modal -->
<div th:replace="~{fragments/confirm-delete-modal :: confirmDeleteModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
