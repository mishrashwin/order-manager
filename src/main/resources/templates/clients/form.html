<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='clients'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${client.id == null ? 'Add Client' : 'Edit Client'}">Client Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-people"></i>
            <span th:text="${client.id == null ? 'Add New Client' : 'Edit Client'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="${returnTo != null ? returnTo : '/clients'}">
            <i class="bi bi-arrow-left"></i> Back to Clients
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

        <form id="clientForm" th:action="@{/clients(returnTo=${returnTo})}" th:object="${client}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-building"></i> Client Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" th:field="*{name}" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person"></i> Contact Person <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" th:field="*{contactPerson}" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-envelope"></i> Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control form-control-custom" th:field="*{email}" required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-telephone"></i> Phone <span class="text-danger">*</span></label>
                    <input type="hidden" id="clientPhone" th:field="*{phone}">
                    <div class="d-flex gap-2">
                        <select id="clientPhoneCountry" class="form-select form-control-custom" aria-label="Country code" required></select>
                        <input type="tel" id="clientPhoneLocal" class="form-control form-control-custom"
                               th:classappend="${phoneError} ? ' is-invalid' : ''" placeholder="Phone number" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${phoneError}" th:text="${phoneError}"></div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-geo-alt"></i> Address</label>
                <textarea class="form-control form-control-custom" th:field="*{address}" rows="3"></textarea>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="${returnTo != null ? returnTo : '/clients'}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button id="clientSubmitBtn" type="submit" class="btn btn-success-custom" disabled>
                    <i class="bi bi-check-circle"></i> <span th:text="${client.id == null ? 'Save Client' : 'Update Client'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/phone-input-widget.js}"></script>
<script>
    function areMandatoryClientFieldsFilled() {
        const name = document.getElementById('name');
        const contactPerson = document.getElementById('contactPerson');
        const email = document.getElementById('email');
        const phoneLocal = document.getElementById('clientPhoneLocal');

        return !!(name && name.value.trim()
            && contactPerson && contactPerson.value.trim()
            && email && email.value.trim()
            && phoneLocal && phoneLocal.value.trim());
    }

    function updateClientSubmitState() {
        const submitButton = document.getElementById('clientSubmitBtn');
        if (!submitButton) {
            return;
        }
        submitButton.disabled = !areMandatoryClientFieldsFilled();
    }

    document.addEventListener('DOMContentLoaded', function () {
        initPhoneInput('clientPhone', 'clientPhoneCountry', 'clientPhoneLocal');
        updateClientSubmitState();

        const clientForm = document.getElementById('clientForm');
        if (clientForm) {
            clientForm.addEventListener('input', updateClientSubmitState);
            clientForm.addEventListener('change', updateClientSubmitState);
        }

        const clientPhoneCountry = document.getElementById('clientPhoneCountry');
        const clientPhoneLocal = document.getElementById('clientPhoneLocal');
        if (clientPhoneCountry) {
            clientPhoneCountry.addEventListener('change', updateClientSubmitState);
        }
        if (clientPhoneLocal) {
            clientPhoneLocal.addEventListener('input', updateClientSubmitState);
        }
    });
</script>
</body>
</html>
