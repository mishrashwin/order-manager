<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="page='clients'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${client.id == null ? 'Add Client' : 'Edit Client'}">Client Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Unified Navbar -->
<div th:replace="~{fragments/unified-navbar :: unified-navbar}"></div>

<!-- Main Content (Full Width) -->
<div class="main-content">
    <!-- Header -->
    <div class="content-header">
        <h1>
            <i class="bi bi-people"></i>
            <span th:text="${client.id == null ? 'Add New Client' : 'Edit Client'}"></span>
        </h1>
        <a class="btn btn-secondary" th:href="@{/clients}">
            <i class="bi bi-arrow-left"></i> Back to Clients
        </a>
    </div>

    <!-- Form Card -->
    <div class="unified-card">
        <form th:action="@{/clients}" th:object="${client}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-building"></i> Client Name</label>
                <input type="text" class="form-control form-control-custom" th:field="*{name}" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-person"></i> Contact Person</label>
                <input type="text" class="form-control form-control-custom" th:field="*{contactPerson}">
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                    <input type="email" class="form-control form-control-custom" th:field="*{email}">
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="bi bi-telephone"></i> Phone</label>
                    <div class="input-group">
                        <select id="phoneCountryCode" class="form-select" style="max-width:175px;"></select>
                        <input type="tel" id="phoneLocalNumber" class="form-control"
                               placeholder="Phone number" autocomplete="off">
                        <input type="hidden" th:field="*{phone}" id="phone">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-geo-alt"></i> Address</label>
                <textarea class="form-control form-control-custom" th:field="*{address}" rows="3"></textarea>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/clients}">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
                <button type="submit" class="btn btn-success-custom">
                    <i class="bi bi-check-circle"></i> <span th:text="${client.id == null ? 'Save Client' : 'Update Client'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/phone-input.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initPhoneInput('phone', 'phoneCountryCode', 'phoneLocalNumber');
        document.querySelector('form').addEventListener('submit', function () {
            document.getElementById('phoneLocalNumber').disabled = true;
            document.getElementById('phoneCountryCode').disabled = true;
        });
    });
</script>
</body>
</html>
