# spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# = APP SETTINGS (Production URLs)
# ===============================
app.frontend.url=${APP_FRONTEND_URL}
app.base.url=${APP_BASE_URL}

# ===============================
# = KEEP-ALIVE SCHEDULER (Production)
# ===============================
# Enable in production to prevent the app from being paused by Render
app.keepalive.enabled=true

# ===============================
# = SECURITY SETTINGS (Production)
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ===============================
# = ACTUATOR (Production monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

