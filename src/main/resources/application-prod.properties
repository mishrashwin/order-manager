# ===============================
# = PRODUCTION ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# = DB MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.outOfOrder=false
spring.flyway.placeholderReplacement=false
spring.flyway.ignoreIgnoredMigrations=true
spring.flyway.ignoreFutureMigrations=true

# ===============================
# = SWAGGER UI - DISABLED
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# = LOGGING (WARN level)
# ===============================
logging.level.root=WARN
logging.level.com.example.ordermanager=INFO
logging.level.org.springframework.web.servlet.resource=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# = EMAIL SETUP (Brevo API)
# ===============================
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}
brevo.request-timeout-ms=10000

# ===============================
# = APP SETTINGS
# ===============================
app.base.url=${APP_BASE_URL}

# ===============================
# = KEEP-ALIVE SCHEDULER
# ===============================
app.keepalive.enabled=true

# ===============================
# = SECURITY SETTINGS
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ===============================
# = STATIC RESOURCES CACHING
# ===============================
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.public=true

# ===============================
# = THYMELEAF CACHING (Production)
# ===============================
spring.thymeleaf.cache=true

# ===============================
# = ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ===============================
# = OWNER CONSOLE CREDENTIALS
# ===============================
app.owner.email=${OWNER_EMAIL}
app.owner.username=${OWNER_USERNAME}
app.owner.password=${OWNER_PASSWORD}

