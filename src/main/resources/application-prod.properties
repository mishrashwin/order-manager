# ===============================
# = PRODUCTION ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = SERVER CONFIGURATION
# ===============================
# Render requires binding to PORT environment variable on 0.0.0.0
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# = DATABASE CONFIGURATION (Production DB - PostgreSQL on Render)
# ===============================
# Render provides these separately (from your connection details):
# - Hostname: dpg-d6injhpr0fns73belc4g-a
# - Port: 5432
# - Database: order_manager_db_2p0k
# - Username: order_manager_db_2p0k_user
# - Password: (provided)
#
# NOTE: DATABASE_URL includes the full postgresql:// URL, but we need jdbc:postgresql://
# So we skip DATABASE_URL and use individual host/port/db instead
spring.datasource.url=jdbc:postgresql://${DB_HOST:dpg-d6injhpr0fns73belc4g-a}:${DB_PORT:5432}/${DB_NAME:order_manager_db_2p0k}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ===============================
# = JPA / HIBERNATE CONFIGURATION (STRICT)
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false
# PostgreSQL: Disable LOB creation to avoid createClob() not implemented errors
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = CONNECTION POOL CONFIGURATION (Optimized)
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# = DB MIGRATION (MANDATORY for Production)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
# Production: Disable outOfOrder to ensure reproducible migrations
spring.flyway.outOfOrder=false
spring.flyway.placeholderReplacement=false
# Ignore validation errors for PostgreSQL 18
spring.flyway.ignoreIgnoredMigrations=true
spring.flyway.ignoreFutureMigrations=true

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# ===============================
# = SWAGGER UI (SpringDoc) - DISABLED FOR PRODUCTION
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# = LOGGING (WARN level for Production)
# ===============================
logging.level.root=WARN
logging.level.com.example.ordermanager=INFO
logging.level.org.springframework.web.servlet.resource=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# = EMAIL SETUP (Brevo API - HTTP-based, works on Render free tier)
# ===============================
# Using Brevo API instead of SMTP because:
# - Render free tier blocks all SMTP ports (25, 465, 587, 2525)
# - Brevo API uses HTTP (not blocked)
# - HTTP requests always allowed on Render
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}

# ===== SMTP Configuration (COMMENTED OUT - Legacy) =====
# Uncomment below if you need Gmail SMTP in the future
# spring.mail.host=${MAIL_HOST:smtp.gmail.com}
