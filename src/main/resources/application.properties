# ===============================
# = SPRING PROFILE CONFIGURATION
# ===============================
# Default profile is 'dev' - can be overridden by:
# - Environment variable: SPRING_PROFILES_ACTIVE=prod
# - JVM argument: -Dspring.profiles.active=prod
# - Docker: ENV SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# = COMMON CONFIGURATION (All Environments)
# ===============================

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = CONNECTION POOL CONFIGURATION =
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000


# ===============================
# = DB MIGRATION =
# ===============================
spring.flyway.enabled=false

# ===============================
# = SERVER CONFIGURATION =
# ===============================
server.port=8080

# ===============================
# = SWAGGER UI (SpringDoc) =
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# For this harmless Chrome DevTools request
#2025-10-31T16:17:22.743+05:30  WARN 8304 --- [nio-8080-exec-2] .m.m.a.ExceptionHandlerExceptionResolver : Resolved [org.springframework.web.servlet.resource.NoResourceFoundException: No static resource .well-known/appspecific/com.chrome.devtools.json.]
# ===============================
logging.level.org.springframework.web.servlet.resource=ERROR

# ===============================
# = EMAIL SETUP =
# ===============================
# = EMAIL SETUP - GMAIL (Development) =
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Optional app settings
app.frontend.url=http://localhost:8080

#Useful Links
#swagger=http://localhost:8080/swagger-ui/index.html#/Order%20Management
#dashboard=http://localhost:8080/dashboard
#api-doc=http://localhost:8080/v3/api-docs
app.base.url=http://localhost:8080



