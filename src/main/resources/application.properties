# ===============================
# = SPRING PROFILE CONFIGURATION
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000

# ===============================
# = DB MIGRATION
# ===============================
spring.flyway.enabled=false

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = EMAIL SETUP (Brevo API)
# ===============================
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}
brevo.request-timeout-ms=5000

# ===============================
# = APP SETTINGS
# ===============================
app.base.url=http://localhost:8080

# ===============================
# = KEEP-ALIVE SCHEDULER
# ===============================
app.keepalive.enabled=true

# ===============================
# = OWNER CONSOLE CREDENTIALS
# ===============================
app.owner.email=${OWNER_EMAIL}
app.owner.username=${OWNER_USERNAME}
app.owner.password=${OWNER_PASSWORD}

# ===============================
# = PAYMENT SETTINGS
# ===============================
app.payment.upi-id=${PAYMENT_UPI_ID:8655898559@yespop}

# ===============================
# = FILE UPLOAD SETTINGS
# ===============================
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.web.servlet.resource=INFO
