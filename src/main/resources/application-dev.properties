# ===============================
# = DEV ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/order_manager_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000

# ===============================
# = DB MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = SWAGGER UI - DISABLED FOR DEV
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.web.servlet.resource=ERROR
logging.level.com.example.ordermanager=DEBUG

# ===============================
# = EMAIL SETUP (Brevo API)
# ===============================
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}
brevo.request-timeout-ms=5000

# ===============================
# = APP SETTINGS
# ===============================
app.base.url=http://localhost:8080

# ===============================
# = KEEP-ALIVE SCHEDULER (Dev)
# ===============================
app.keepalive.enabled=false

# ===============================
# = ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ===============================
# = OWNER CONSOLE CREDENTIALS
# ===============================
app.owner.email=${OWNER_EMAIL}
app.owner.username=${OWNER_USERNAME}
app.owner.password=${OWNER_PASSWORD}
