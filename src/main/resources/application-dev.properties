# ===============================
# = DEV ENVIRONMENT CONFIGURATION
# ===============================

# ===============================
# = DATABASE CONFIGURATION (Local MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/order_manager_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = CONNECTION POOL CONFIGURATION
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000

# ===============================
# = DB MIGRATION
# ===============================
spring.flyway.enabled=false

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = SWAGGER UI (SpringDoc) - ENABLED
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.web.servlet.resource=ERROR
logging.level.com.example.ordermanager=DEBUG

# ===============================
# = EMAIL SETUP - Development (Brevo API)
# ===============================
# Using Brevo API (HTTP-based) for consistent behavior across all environments
# SMTP commented out - can be re-enabled in future if needed

# Brevo API Configuration (Primary)
brevo.api-key=${BREVO_API_KEY}
spring.mail.from=${MAIL_FROM}

